<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마감 역산 일정표</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a2b30">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 점선 모눈 수첩 — 인덱스 탭(일정) → 오늘 할 일 → 월간 달력. 굵은 먹선으로 칸을 나누고, 기간은 형광펜, 마감은 라벨 스티커 */
:root{
  --paper:#fafaf7;--dot:#d9d9d2;--surface:#ffffff;--ink:#1c1d21;--muted:#6f7076;--line:#d8d8d2;--rule:#1c1d21;
  --bg:var(--paper);--soft:#eef1f8;--seg1:#3b3c42;--seg2:#5d5e65;--good:#1f8a55;--warn:#b26a00;--bad:#c8333a;--accent:#2f6fd6;
  --c1:#2f6fd6;--c2:#d0483f;--c3:#1f8a55;--c4:#b0700f;--c5:#7a4bc4;--c6:#0f8a8a;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fd:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#16171a;--dot:#2c2d31;--surface:#1d1e22;--ink:#ecebe6;--muted:#9c9ca3;--line:#34353a;--rule:#ecebe6;--soft:#1d2533;--seg1:#55565d;--seg2:#77787f;--good:#45c486;--warn:#e3a646;--bad:#ef6a70;--accent:#6b9cf0;--c1:#6b9cf0;--c2:#ef7a72;--c3:#4cc98a;--c4:#e3a646;--c5:#a98be8;--c6:#4fc4c4;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;word-break:keep-all;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;background-position:-1px -1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand,var(--accent));outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 머리 */
header.top{display:flex;align-items:flex-end;gap:8px;padding-block:22px 12px;flex-wrap:wrap;border-bottom:3px solid var(--rule);margin-bottom:14px}
header.top h1{margin:0 auto 0 0;font-family:var(--fd);font-weight:400;font-size:30px;letter-spacing:-.01em;line-height:1}
header.top h1::after{content:"DEADLINE PLANNER";display:block;font-family:var(--fm);font-size:10.5px;letter-spacing:.28em;color:var(--muted);margin-top:8px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:4px;padding:7px 13px;font-size:14px;font-weight:700;white-space:nowrap;transition:transform .12s var(--ease),box-shadow .12s var(--ease),background-color .15s}
.btn:active{transform:translate(1px,1px);box-shadow:none!important}
@media (hover:hover){.btn:hover{box-shadow:3px 3px 0 var(--rule);transform:translate(-1px,-1px)}}
.btn.primary{background:var(--brand,var(--ink));color:var(--brand-ink,var(--paper));border-color:var(--rule)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
@media (hover:hover){.btn.ghost:hover{box-shadow:none;transform:none;color:var(--ink)}}
.btn.sm{padding:4px 10px;font-size:13px}
/* 보기 전환: 수첩 인덱스 */
.viewseg{display:flex;gap:0;margin:0 0 14px;border-bottom:1.5px solid var(--rule)}
.viewseg button{border:1.5px solid transparent;border-bottom:0;background:transparent;border-radius:6px 6px 0 0;padding:6px 18px 7px;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:-1.5px}
.viewseg button.on{background:var(--surface);color:var(--ink);border-color:var(--rule);box-shadow:inset 0 3px 0 var(--brand,var(--ink))}
/* 일정 탭 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:thin}
.ptab{flex-shrink:0;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 6px 5px 12px;font-size:14px;font-weight:500;max-width:280px}
.ptab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptab .dd{white-space:nowrap;flex-shrink:0;font-family:var(--fm);font-size:12px;font-weight:700;padding:0 6px;color:var(--muted)}
.ptab.on{border-color:var(--rule);box-shadow:3px 3px 0 var(--brand,var(--rule))}
.dd.urgent{color:var(--bad)!important}
/* 칸(카드 대신 먹선 칸) */
.card{background:var(--surface);border:1.5px solid var(--rule);border-radius:2px;padding:18px 20px;margin-bottom:16px;position:relative}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sh h2{margin:0;font-family:var(--fd);font-weight:400;font-size:19px;letter-spacing:0}
.sh span{font-size:12.5px;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:12px}
.name{font-family:var(--fd);font-weight:400;font-size:26px;border:0;border-bottom:1.5px dashed transparent;border-radius:0;padding:2px 0;background:transparent;width:100%;min-width:0}
.name:hover{border-bottom-color:var(--line)}.name:focus{outline:none;border-bottom-color:var(--rule)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:4px;padding:3px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand,var(--ink));border-color:var(--rule);color:var(--brand-ink,var(--paper));font-weight:700}
.dates{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.fld input,.client textarea{border:0;border-bottom:1.5px solid var(--rule);background:transparent;border-radius:0;padding:6px 2px;font-size:15px;font-weight:500;color:var(--ink);min-width:0;font-family:var(--f)}
.fld input[type=date]{font-family:var(--fm);font-size:14.5px}
.fld input:focus,.client textarea:focus{outline:none;border-bottom-color:var(--brand,var(--accent));background:var(--tint,transparent)}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;padding-bottom:7px;cursor:pointer;user-select:none}
.tog input{width:17px;height:17px;accent-color:var(--brand,var(--ink))}
.client{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1.5px dashed var(--line);padding-top:12px}
.client .full{grid-column:1/-1}
.client textarea{min-height:56px;resize:vertical;line-height:1.6;border:1.5px solid var(--line);padding:8px 10px}
@media (max-width:560px){.client{grid-template-columns:minmax(0,1fr)}}
/* 요약: D-day 도장 */
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center}
.dday{font-family:var(--fm);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--brand,var(--bad));border:3px double currentColor;padding:12px 14px 10px;transform:rotate(-4deg);text-align:center;min-width:150px}
.dday small{display:block;font-family:var(--f);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:8px}
.stat{display:flex;flex-direction:column;gap:9px;min-width:0}
.pill{align-self:flex-start;font-size:14px;font-weight:700;color:var(--good);padding:0 2px;background:linear-gradient(transparent 58%,color-mix(in oklab,currentColor 22%,transparent) 0)}
.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.idle{color:var(--muted)}
.wait{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--brand,var(--accent));border:1.5px solid currentColor;border-radius:3px;padding:0 6px;transform:rotate(-2deg)}
.now{font-size:14px;color:var(--muted)}
.now b{color:var(--ink)}
.prog{height:12px;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--line) 9px 10px);border:1.5px solid var(--rule);position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--brand,var(--ink));transition:width .6s var(--ease)}
.prog em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-family:var(--fm)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;background:var(--brand,var(--ink))}
.legend span.exp::before{width:2px;background:var(--bad)}
.tl{position:relative;margin-top:30px}
.tlbar{display:flex;height:30px;gap:0;border:1.5px solid var(--rule)}
.seg{position:relative;min-width:3px;background:var(--surface);overflow:hidden;display:flex;align-items:center;padding:0 8px;color:var(--ink);font-size:12px;font-weight:700;white-space:nowrap;border-left:1.5px solid var(--rule)}
.seg:first-child{border-left:0}
.seg .fill{position:absolute;inset:0 auto 0 0;background:var(--tint,color-mix(in oklab,var(--ink) 14%,transparent))}
.seg.done .fill{background:color-mix(in oklab,var(--good) 30%,transparent)}
.seg.done span{text-decoration:line-through;text-decoration-thickness:2px}
.seg span{position:relative;overflow:hidden;text-overflow:ellipsis}
.tlnow{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--bad)}
.tlnow::after{content:"TODAY";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:var(--fm);font-size:10.5px;font-weight:700;color:var(--bad);letter-spacing:.1em}
.tlax{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--fm)}
/* 단계 표 */
.stages{display:flex;flex-direction:column}
.colh,.st{display:grid;grid-template-columns:30px minmax(0,1.3fr) 70px minmax(0,1.5fr) minmax(0,1.2fr) auto;gap:10px;align-items:center}
.colh{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding:0 0 6px;border-bottom:1.5px solid var(--rule)}
.st{padding:9px 0;border-top:1px dashed var(--line)}
.st:first-child{border-top:0}
.st.cur{background:linear-gradient(transparent 0,var(--tint,var(--soft)) 0)}
.st .no{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.st.cur .no{color:var(--brand,var(--accent))}
.st.isdone .no{color:var(--good)}
.st input[type=text],.st input[type=number]{border:0;border-bottom:1.5px solid var(--line);background:transparent;border-radius:0;padding:6px 2px;width:100%;min-width:0;font-size:14.5px}
.st input:focus{outline:none;border-bottom-color:var(--rule)}
.st input[type=number]{text-align:right;font-family:var(--fm)}
.st.isdone input[type=text]{text-decoration:line-through;color:var(--muted)}
.st .when{font-size:13px;font-family:var(--fm);line-height:1.45}
.st .when small{display:block;color:var(--muted);font-size:11.5px}
.st .when .late{color:var(--bad);font-weight:700}
.pc{display:flex;align-items:center;gap:8px}
.pc input[type=range]{flex:1;min-width:0;accent-color:var(--brand,var(--ink))}
.pc output{font-family:var(--fm);font-size:12.5px;width:40px;text-align:right;color:var(--muted)}
.donechk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.donechk input{width:16px;height:16px;accent-color:var(--good)}
.ops{display:flex;gap:2px}
.ic{border:0;background:transparent;color:var(--muted);border-radius:3px;width:28px;height:28px;font-size:14px}
.ic:hover{background:var(--tint,var(--soft));color:var(--ink)}
.ic:disabled{opacity:.3;cursor:default}
.ic.del.arm{background:var(--bad);color:#fff;width:auto;padding:0 8px;font-size:12px;font-weight:700}
.addst{margin-top:12px}
@media (max-width:720px){
  header.top h1{flex-basis:100%;margin-bottom:6px}
  header.top .btn{padding:6px 10px;font-size:13.5px}
  .colh{display:none}
  .st{grid-template-columns:30px minmax(0,1fr) 64px;row-gap:6px}
  .st .when,.st .pc{grid-column:2/-1}
  .st .ops{grid-column:2/-1;justify-content:flex-end}
  .sum{grid-template-columns:minmax(0,1fr);gap:18px}
  .dday{justify-self:start;font-size:34px}
}
textarea.memo{width:100%;min-height:100px;border:1.5px solid var(--line);border-radius:0;padding:4px 10px;resize:vertical;line-height:28px;background:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);background-attachment:local}
textarea.memo:focus{outline:none;border-color:var(--rule)}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 34px}
.foot .grow{flex:1}
.delp{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px}
.delp.arm{color:#fff;background:var(--bad);text-decoration:none;border-radius:3px;font-weight:700}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--fd);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:6px}
/* 예시 안내: 메모지 */
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in oklab,var(--c4) 16%,var(--surface));border:0;padding:12px 16px 12px 18px;font-size:13.5px;margin:4px 0 16px;position:relative;box-shadow:2px 3px 0 color-mix(in oklab,var(--ink) 12%,transparent);transform:rotate(-.4deg)}
.sample::before{content:"";position:absolute;top:-9px;left:28px;width:70px;height:18px;background:color-mix(in oklab,var(--c1) 30%,transparent);transform:rotate(-4deg)}
.sample span{flex:1;min-width:200px}
.install{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--rule);padding:10px 14px;font-size:13.5px;margin-bottom:14px;background:var(--surface)}
.install span{flex:1;min-width:200px;color:var(--muted)}
/* 새 일정 */
.newov{position:fixed;inset:0;z-index:20;background:rgba(14,14,16,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 14px 20px;overflow-y:auto}
.newbox{background:var(--paper);border:2px solid var(--rule);box-shadow:6px 6px 0 var(--rule);width:100%;max-width:520px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:up .28s var(--ease)}
.newbox h2{margin:0;font-family:var(--fd);font-weight:400;font-size:22px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.presets .preset:last-child:nth-child(odd){grid-column:1/-1}
.preset{border:1.5px solid var(--line);background:var(--surface);border-radius:3px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.preset b{font-size:15px}
.preset span{font-size:12.5px;color:var(--muted);line-height:1.5}
.preset[aria-pressed="true"]{border-color:var(--rule);box-shadow:3px 3px 0 var(--brand,var(--rule))}
/* 색상 */
.hwrap{position:relative}
.palpop{position:absolute;right:0;top:calc(100% + 8px);z-index:15;background:var(--surface);border:1.5px solid var(--rule);box-shadow:4px 4px 0 var(--rule);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:230px;animation:up .2s var(--ease)}
.palopt{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:2px;padding:8px 10px;text-align:left;font-size:14px;font-weight:500}
.palopt:hover{background:var(--tint,var(--soft))}
.palopt[aria-pressed="true"]{font-weight:700;box-shadow:inset 3px 0 0 var(--rule)}
.palopt .sw{display:flex;gap:3px;margin-left:auto}
.palopt .sw i{width:14px;height:14px;display:block;border-radius:2px}
/* 오늘 할 일 */
.todo{display:flex;flex-direction:column}
.todo-i{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;border-top:1px dashed var(--line);padding:11px 2px;background:transparent;text-align:left;width:100%}
.todo-i:first-child{border-top:0}
.todo-i .cl{width:14px;height:14px;border:2px solid var(--rule);border-radius:2px;position:relative}
.todo-i b{display:block;font-size:15px}
.todo-i span{font-size:13px;color:var(--muted)}
.todo-i .dd2{font-family:var(--fm);font-size:14px;font-weight:700;white-space:nowrap}
.todo-i .dd2.urgent{color:var(--bad)}
@media (hover:hover){.todo-i:hover b{text-decoration:underline;text-underline-offset:3px}}
/* 달력 */
.calhead{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px}
.calhead h2{margin:0 auto 0 0;font-family:var(--fd);font-weight:400;font-size:28px;line-height:1}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-bottom:12px}
.legend2 button{border:0;background:transparent;padding:2px 0;display:flex;align-items:center;gap:7px;color:var(--ink)}
.legend2 i{width:22px;height:9px;display:inline-block;opacity:.75;transform:skewX(-14deg)}
.legend2 button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1.5px solid var(--rule)}
.cal .wd{font-family:var(--fm);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:6px 6px;border-right:1px solid var(--line);border-bottom:1.5px solid var(--rule);text-align:left}
.cal .wd:nth-child(7){border-right:0}
.cal .wd.sun,.day.sun .dn{color:var(--bad)}.cal .wd.sat,.day.sat .dn{color:var(--accent)}
.day{min-height:106px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;cursor:pointer;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:transparent}.day.out .dn{opacity:.35}
.day .dn{font-family:var(--fm);font-size:13px;font-weight:700;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.day.today .dn{background:transparent!important;color:var(--brand,var(--bad))!important;border:2px solid currentColor;border-radius:50% 46% 52% 44%;transform:rotate(-8deg)}
.day.sel{box-shadow:inset 0 0 0 2px var(--rule)}
@media (hover:hover){.day:hover{background:var(--tint,var(--soft))}}
.bars{display:flex;flex-direction:column;gap:2px}
.bars i{height:5px;display:block;opacity:.42;transform:skewX(-18deg)}
.bars i.s{margin-left:35%}.bars i.e{margin-right:35%}
.chips2{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev{font-size:11.5px;line-height:1.35;padding:1px 6px 1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 50%,100% 100%,0 100%)}
.ev.fin{box-shadow:inset 3px 0 0 rgba(0,0,0,.35)}
.ev.dn2{opacity:.4;text-decoration:line-through}
.more{font-family:var(--fm);font-size:11px;color:var(--muted);padding-left:3px}
.daypanel{margin-top:16px;border-top:1.5px solid var(--rule);padding-top:12px}
.daypanel h3{margin:0 0 6px;font-family:var(--fd);font-weight:400;font-size:19px}
.dp-i{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border:0;border-top:1px dashed var(--line);text-align:left;width:100%;background:transparent}
.dp-i:first-of-type{border-top:0}
.dp-i .cl{width:14px;height:8px;transform:skewX(-14deg)}
.dp-i b{font-size:14.5px}
.dp-i span{font-size:13px;color:var(--muted);display:block}
.dp-i em{font-style:normal;font-family:var(--fm);font-size:12px;font-weight:700;white-space:nowrap}
.dp-empty{color:var(--muted);font-size:14px}
@media (max-width:640px){
  .day{min-height:64px;padding:3px 2px}
  .day .dn{font-size:12px;width:22px;height:22px}
  .ev{font-size:0;padding:0;height:6px;clip-path:none}
  .more{display:none}
  .bars i{height:4px}
  .calhead h2{font-size:24px}
}
/* 위젯 */
.mini{max-width:440px;margin:0 auto}
.mini .card{padding:14px 16px}
.mini-top{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;border-bottom:3px solid var(--rule);padding-bottom:8px}
.mini-top b{font-family:var(--fd);font-weight:400;font-size:28px;line-height:1.1}
.agenda{display:flex;flex-direction:column}
.ag{display:grid;grid-template-columns:58px 12px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border:0;border-top:1px dashed var(--line);font-size:14px;text-align:left;background:transparent;width:100%}
.ag:first-child{border-top:0}
.ag .d{font-family:var(--fm);font-size:12.5px;color:var(--muted);font-weight:700}
.ag .d.urgent{color:var(--bad)}
.ag i{width:12px;height:8px;transform:skewX(-14deg)}
.ag b{font-weight:700}.ag small{color:var(--muted);font-size:12.5px;display:block}
body.wmode header.top,body.wmode .viewseg,body.wmode #sample{display:none}
body.wmode .wrap{padding-top:10px}
.wexit{display:none}
body.wmode .wexit{display:inline-flex;margin:0 auto 10px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);border:1.5px solid var(--rule);padding:9px 16px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:4px 4px 0 color-mix(in oklab,var(--ink) 30%,transparent)}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{animation:up .4s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top">

    <button class="btn" id="bkBtn">백업 받기</button>
    <button class="btn" id="ldBtn">불러오기</button>
    <span class="hwrap"><button class="btn" id="palBtn" aria-haspopup="true" aria-expanded="false">색상</button></span>

  </header>
  <div class="viewseg" role="group" aria-label="보기 방식"><button type="button" data-v="cal">달력</button><button type="button" data-v="list">일정별</button><button type="button" data-v="mini">위젯</button></div>
  <div class="install" id="installBar" hidden><span id="installTxt">앱으로 설치하면 바탕화면이나 홈 화면에서 바로 열 수 있어요.</span><button class="btn sm primary" id="installBtn">앱으로 설치</button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="일정 목록"></div>
  <div id="sample" class="sample" hidden><span>처음 열면 보이는 <b>예시 일정</b>이에요. 둘러본 다음 지우고 내 일정을 만들어 주세요.</span><button class="btn sm" id="sampleDel">예시 지우기</button></div>
  <main id="main"></main>
  <main id="cal" hidden></main>
  <main id="mini" class="mini" hidden></main>
</div>

<div class="newov" id="newov" hidden role="dialog" aria-modal="true" aria-labelledby="nTitle">
  <div class="newbox">
    <h2 id="nTitle">새 일정 만들기</h2>
    <div class="presets" id="presets"></div>
    <label class="fld">이름<input id="nName" placeholder="예: 졸업작품 웹툰 1화"></label>
    <label class="fld" id="nClientW" hidden>의뢰인<input id="nClient" placeholder="닉네임이나 이름"></label>
    <div class="dates">
      <label class="fld">시작일<input type="date" id="nStart"></label>
      <label class="fld">마감일<input type="date" id="nDue"></label>
    </div>
    <div class="foot" style="margin:0"><span class="grow"></span><button class="btn ghost" id="nCancel">취소</button><button class="btn primary" id="nOk">만들기</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const KEY='deadline-planner-v1';
const PRESETS={
  grad:{label:'졸업작품',desc:'몇 달짜리 웹툰·애니 졸작',stages:[['기획·시나리오',15],['콘티',20],['선화',25],['채색',22],['식자·후보정',10],['여유 기간',8]]},
  work:{label:'과제작',desc:'단편 만화·애니 같은 작품 과제',stages:[['기획',15],['콘티',25],['작화',40],['마무리',12],['여유 기간',8]]},
  task:{label:'과제물',desc:'리포트·기획안·발표 자료',stages:[['자료 조사',30],['초안 작성',35],['수정',20],['제출 준비',8],['여유 기간',7]]},
  comm:{label:'커미션',desc:'의뢰받은 그림·만화 작업',stages:[['문의·자료 확인',8],['러프',15],['러프 컨펌',8],['선화',22],['채색',25],['수정',12],['납품',5],['여유 기간',5]]},
  custom:{label:'직접 만들기',desc:'단계를 내 마음대로',stages:[['1단계',34],['2단계',33],['3단계',33]]}
};
const TYPES={grad:'졸업작품',work:'과제작',task:'과제물',comm:'커미션',custom:'기타'};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
let tT;function toast(m,k){const t=$('#toast');t.textContent=m;t.className='toast'+(k?' '+k:'');t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2400)}

// ---------- 날짜 ----------
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1,12)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const W=['일','월','화','수','목','금','토'];
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+W[d.getDay()]+')'};

// ---------- 저장 ----------
let S=null,canSave=true;
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.projects))return d}}catch(e){canSave=false}return null}
function save(){if(!canSave)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canSave=false}}
function sampleData(){const t=today();
  const mk=(type,name,start,due,prog)=>({id:uid(),name,type,start,due,skipWeekend:false,memo:'',sample:true,stages:PRESETS[type].stages.map(([n,w],i)=>({id:uid(),name:n,w,pct:prog[i]||0,done:(prog[i]||0)>=100}))});
  return {v:1,cur:null,projects:[mk('grad','예시: 졸업작품 웹툰',addD(t,-40),addD(t,95),[100,60,0,0,0,0]),mk('task','예시: 콘텐츠기획 기말 리포트',addD(t,-3),addD(t,11),[70,0,0,0,0]),Object.assign(mk('comm','예시: 캐릭터 일러스트 커미션',addD(t,-6),addD(t,14),[100,100,40,0,0,0,0,0]),{client:'예시 의뢰인',contact:'DM으로 연락',brief:'전신 1인, 배경 없음, 러프 단계에서 한 번 확인받기로 함'})]}}
S=load()||sampleData();if(!S.cur||!S.projects.some(p=>p.id===S.cur))S.cur=S.projects[0]?S.projects[0].id:null;

// ---------- 계산 ----------
function workDays(p){const out=[];const n=diff(p.start,p.due);if(n<0)return out;for(let i=0;i<=n;i++){const s=addD(p.start,i);const wd=pd(s).getDay();if(!p.skipWeekend||(wd!==0&&wd!==6))out.push(s)}if(!out.length&&n>=0)out.push(p.due);return out}
function plan(p){const days=workDays(p);const N=days.length;const tw=p.stages.reduce((a,s)=>a+Math.max(0,+s.w||0),0)||1;
  let cum=0,prevEnd=-1;const rows=p.stages.map((s,i)=>{cum+=Math.max(0,+s.w||0);let end=Math.round(cum/tw*N)-1;if(i===p.stages.length-1)end=N-1;
    let start=prevEnd+1;if(end<start)end=start;if(start>N-1){start=N-1;end=N-1}if(end>N-1)end=N-1;prevEnd=end;
    return {s,start:days[start],end:days[end],si:start,ei:end,n:end-start+1}});
  return {days,N,tw,rows}}
function status(p){const P=plan(p);const t=today();const tw=P.tw;
  const actual=p.stages.reduce((a,s)=>a+Math.max(0,+s.w||0)*(s.done?1:Math.min(100,+s.pct||0)/100),0)/tw;
  let ti=P.days.findIndex(d=>d>t);if(ti<0)ti=P.N;  // 오늘까지 지난 작업일 수
  let expected=0;P.rows.forEach(r=>{const w=Math.max(0,+r.s.w||0);const passed=Math.max(0,Math.min(r.n,ti-r.si));expected+=w*passed/r.n});expected/=tw;
  const lagDays=(expected-actual)*P.N;
  const cur=P.rows.find(r=>t>=r.start&&t<=r.end&&!r.s.done)||P.rows.find(r=>!r.s.done&&r.start>t)||null;
  const left=diff(t,p.due);
  let kind='good',text='계획대로 가고 있어요';
  if(actual>=0.999){kind='good';text='모든 단계를 끝냈어요'}
  else if(t<p.start){kind='idle';text='아직 시작 전이에요'}
  else if(left<0){kind='bad';text='마감일이 지났어요'}
  else if(lagDays>=3){kind='bad';text='계획보다 약 '+Math.round(lagDays)+'일 늦어요'}
  else if(lagDays>=1){kind='warn';text='계획보다 약 '+Math.round(lagDays)+'일 늦어요'}
  else if(lagDays<=-1){kind='good';text='계획보다 약 '+Math.round(-lagDays)+'일 앞서 있어요'}
  return {P,actual,expected,lagDays,cur,left,kind,text}}
const ddText=n=>n>0?'D-'+n:n===0?'D-day':'D+'+(-n);

// ---------- 그리기 ----------
function cur(){return S.projects.find(p=>p.id===S.cur)||null}
function render(){save();applyPal();S.view=S.view||'cal';const v=WMODE?'mini':S.view,list=v==='list';
  document.querySelectorAll('.viewseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#tabs').hidden=!list;$('#main').hidden=!list;$('#cal').hidden=v!=='cal';$('#mini').hidden=v!=='mini';
  if(v==='cal')renderCal();else if(v==='mini')renderMini();else{renderTabs();renderMain()}
  $('#sample').hidden=!S.projects.some(p=>p.sample)}
document.querySelectorAll('.viewseg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
// ---------- 달력 ----------
const PALS={
  basic:{name:'기본',brand:'',c:['#2f6fd6','#d0483f','#1f8a55','#b0700f','#7a4bc4','#0f8a8a']},
  pastel:{name:'파스텔',brand:'#8a7dde',c:['#8fb3ff','#ff9fb0','#86d9ab','#ffcc70','#c3a8ff','#84d8d8']},
  vivid:{name:'비비드',brand:'#ff4d6d',c:['#ff4d6d','#3a86ff','#ff9f1c','#06b88a','#8338ec','#2ec4b6']},
  forest:{name:'숲',brand:'#2d6a4f',c:['#2d6a4f','#c08a3e','#3d8fa3','#b5838d','#74a557','#6d597a']},
  sunset:{name:'노을',brand:'#e76f51',c:['#e76f51','#2a9d8f','#e9c46a','#264653','#f4a261','#9d4edd']}};
const lum=h=>{const n=parseInt(h.slice(1),16);const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255)};
const textOn=h=>lum(h)>.42?'#17181b':'#ffffff';
function pal(){return PALS[S.palette]||PALS.basic}
function applyPal(){const P=pal(),r=document.documentElement.style;if(P.brand){r.setProperty('--brand',P.brand);r.setProperty('--brand-ink',textOn(P.brand));r.setProperty('--tint',P.brand+'1f')}else{r.removeProperty('--brand');r.removeProperty('--brand-ink');r.removeProperty('--tint')}
  P.c.forEach((c,i)=>r.setProperty('--c'+(i+1),c));const tm=document.querySelector('meta[name=theme-color]');if(tm)tm.content=P.brand||'#2a2b30'}
const colorOf=p=>{const i=S.projects.indexOf(p);return pal().c[(p.color!=null?p.color:i)%6]};
let calY=null,calM=null,selDay=today();const hidden=new Set();
function allEvents(){const ev=[];S.projects.forEach(p=>{if(hidden.has(p.id))return;const P=plan(p);
  P.rows.forEach(r=>{if(/여유/.test(r.s.name))return;if(r.end===p.due&&r===P.rows[P.rows.length-1])return;ev.push({date:r.end,p,label:r.s.name+' 마감',done:!!r.s.done,fin:false,row:r})});
  ev.push({date:p.due,p,label:'최종 마감',done:p.stages.every(s=>s.done),fin:true})});return ev}
function openProject(p){S.cur=p.id;S.view='list';render();scrollTo(0,0)}
function renderCal(){const box=$('#cal');box.textContent='';
  if(calY==null){const t=pd(today());calY=t.getFullYear();calM=t.getMonth()}
  // 오늘 할 일
  const td=el('section','card');const sh=el('div','sh');sh.append(el('h2','','오늘 할 일'),el('span','',md(today())));td.appendChild(sh);
  const list=el('div','todo');let any=false;
  [...S.projects].sort((a,b)=>a.due<b.due?-1:1).forEach(p=>{const st=status(p);if(st.actual>=0.999||today()<p.start)return;any=true;
    const b=el('button','todo-i');b.type='button';const c=el('i','cl');c.style.background=colorOf(p);const tx=el('div');
    const stage=st.cur?st.cur.s.name+' · '+md(st.cur.end)+'까지':(st.left<0?'마감 지남':'');tx.append(el('b','',p.name),el('span','',stage+(st.kind==='bad'||st.kind==='warn'?' · '+st.text:'')));
    b.append(c,tx,el('span','dd2'+(st.left<=7?' urgent':''),ddText(st.left)));b.onclick=()=>openProject(p);list.appendChild(b)});
  if(!any)list.appendChild(el('p','dp-empty',S.projects.length?'오늘 진행 중인 일정이 없어요.':'‘+ 새 일정’으로 첫 일정을 만들어 보세요.'));
  td.appendChild(list);box.appendChild(td);
  // 달력
  const cc=el('section','card');const hd=el('div','calhead');
  const prev=el('button','btn sm','‹');prev.setAttribute('aria-label','이전 달');prev.onclick=()=>{calM--;if(calM<0){calM=11;calY--}render()};
  const next=el('button','btn sm','›');next.setAttribute('aria-label','다음 달');next.onclick=()=>{calM++;if(calM>11){calM=0;calY++}render()};
  const tb=el('button','btn sm ghost','오늘');tb.onclick=()=>{const t=pd(today());calY=t.getFullYear();calM=t.getMonth();selDay=today();render()};
  hd.append(el('h2','',calY+'년 '+(calM+1)+'월'),tb,prev,next);cc.appendChild(hd);
  if(S.projects.length){const lg=el('div','legend2');S.projects.forEach(p=>{const b=el('button');b.type='button';b.setAttribute('aria-pressed',!hidden.has(p.id));const c=el('i');c.style.background=colorOf(p);b.append(c,document.createTextNode(p.name));b.title='눌러서 달력에서 숨기기/보이기';b.onclick=()=>{hidden.has(p.id)?hidden.delete(p.id):hidden.add(p.id);render()};lg.appendChild(b)});cc.appendChild(lg)}
  const g=el('div','cal');['일','월','화','수','목','금','토'].forEach((w,i)=>g.appendChild(el('div','wd'+(i===0?' sun':i===6?' sat':''),w)));
  const first=new Date(calY,calM,1,12);const startD=ymd(new Date(calY,calM,1-first.getDay(),12));const lastD=new Date(calY,calM+1,0,12);const weeks=Math.ceil((first.getDay()+lastD.getDate())/7);
  const evs=allEvents();const byDay={};evs.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e)});
  const vis=S.projects.filter(p=>!hidden.has(p.id));
  for(let i=0;i<weeks*7;i++){const d=addD(startD,i);const dt=pd(d);const wd=dt.getDay();
    const c=el('button','day'+(dt.getMonth()!==calM?' out':'')+(d===today()?' today':'')+(d===selDay?' sel':'')+(wd===0?' sun':wd===6?' sat':''));c.type='button';
    const list=byDay[d]||[];c.setAttribute('aria-label',(dt.getMonth()+1)+'월 '+dt.getDate()+'일'+(list.length?', 마감 '+list.length+'개':''));
    c.appendChild(el('span','dn',String(dt.getDate())));
    const bars=el('div','bars');vis.forEach(p=>{if(d<p.start||d>p.due)return;const b=el('i',(d===p.start?'s':'')+(d===p.due?' e':''));b.style.background=colorOf(p);bars.appendChild(b)});c.appendChild(bars);
    const ch=el('div','chips2');list.slice(0,3).forEach(e=>{const x=el('span','ev'+(e.fin?' fin':'')+(e.done?' dn2':''),e.label);x.title=e.p.name+' · '+e.label;x.style.background=colorOf(e.p);x.style.color=textOn(colorOf(e.p));ch.appendChild(x)});
    if(list.length>3)ch.appendChild(el('span','more','+'+(list.length-3)));c.appendChild(ch);
    c.onclick=()=>{selDay=d;render()};g.appendChild(c)}
  cc.appendChild(g);
  // 선택한 날
  const dp=el('div','daypanel');const sd=pd(selDay);dp.appendChild(el('h3','',(sd.getMonth()+1)+'월 '+sd.getDate()+'일 ('+W[sd.getDay()]+')'+(selDay===today()?' · 오늘':'')));
  let n=0;vis.forEach(p=>{const P=plan(p);
    (byDay[selDay]||[]).filter(e=>e.p===p).forEach(e=>{n++;const r=el('button','dp-i');r.type='button';const c=el('i','cl');c.style.background=colorOf(p);const tx=el('div');tx.append(el('b','',e.label),el('span','',p.name));r.append(c,tx,el('em','',e.done?'완료':e.fin?'마감일':'단계 마감'));r.onclick=()=>openProject(p);dp.appendChild(r)});
    if(selDay>=p.start&&selDay<=p.due){const row=P.rows.find(r=>selDay>=r.start&&selDay<=r.end)||null;if(row&&!(byDay[selDay]||[]).some(e=>e.p===p&&e.row&&e.row.s===row.s)){n++;const r=el('button','dp-i');r.type='button';const c=el('i','cl');c.style.background=colorOf(p);const tx=el('div');tx.append(el('b','',row.s.name+' 하는 기간'),el('span','',p.name+' · '+md(row.end)+'까지'));r.append(c,tx,el('em','',row.s.done?'완료':(row.s.done?100:(+row.s.pct||0))+'%'));r.onclick=()=>openProject(p);dp.appendChild(r)}}});
  if(!n)dp.appendChild(el('p','dp-empty','이날은 일정이 없어요.'));
  cc.appendChild(dp);box.appendChild(cc)}

function renderTabs(){const box=$('#tabs');box.textContent='';
  [...S.projects].sort((a,b)=>a.due<b.due?-1:1).forEach(p=>{const b=el('button','ptab'+(p.id===S.cur?' on':''));b.setAttribute('role','tab');b.setAttribute('aria-selected',p.id===S.cur);
    const n=diff(today(),p.due);const done=p.stages.every(s=>s.done);b.append(el('span','nm',(p.name||'이름 없는 일정')+(p.client&&!String(p.name).includes(p.client)?' · '+p.client:'')),el('span','dd'+(!done&&n>=0&&n<=7?' urgent':''),done?'완료':ddText(n)));
    b.onclick=()=>{S.cur=p.id;render()};box.appendChild(b)})}
function renderMain(){const m=$('#main');m.textContent='';const p=cur();
  if(!p){const e=el('div','empty');e.append(el('b','','아직 일정이 없어요'),document.createTextNode('위의 ‘+ 새 일정’을 눌러 졸업작품이나 과제 마감을 넣어 보세요.'));m.appendChild(e);return}
  const st=status(p),P=st.P;
  // 머리
  const h=el('section','card head');
  const nm=el('input','name');nm.value=p.name;nm.setAttribute('aria-label','일정 이름');nm.onchange=()=>{p.name=nm.value.trim()||p.name;delete p.sample;render()};
  const ty=el('div','types');Object.entries(TYPES).forEach(([k,v])=>{const c=el('button','chip',v);c.type='button';c.setAttribute('aria-pressed',p.type===k);c.onclick=()=>{p.type=k;render()};ty.appendChild(c)});
  const ds=el('div','dates');
  const fs=el('label','fld','시작일');const si=el('input');si.type='date';si.value=p.start;fs.appendChild(si);
  const fd=el('label','fld','마감일');const di=el('input');di.type='date';di.value=p.due;fd.appendChild(di);
  si.onchange=()=>{if(!si.value)return;if(si.value>p.due){toast('시작일은 마감일보다 앞이어야 해요.','bad');si.value=p.start;return}p.start=si.value;render()};
  di.onchange=()=>{if(!di.value)return;if(di.value<p.start){toast('마감일은 시작일보다 뒤여야 해요.','bad');di.value=p.due;return}p.due=di.value;render()};
  const tg=el('label','tog');const cb=el('input');cb.type='checkbox';cb.checked=!!p.skipWeekend;cb.onchange=()=>{p.skipWeekend=cb.checked;render()};tg.append(cb,document.createTextNode('주말은 쉬어요'));
  ds.append(fs,fd,tg);h.append(nm,ty,ds);
  if(p.type==='comm'||p.client||p.contact||p.brief){const cg=el('div','client');const mkf=(label,key,ph,area)=>{const f=el('label','fld'+(area?' full':''),label);const i=el(area?'textarea':'input');i.value=p[key]||'';i.placeholder=ph;i.onchange=()=>{const v=i.value.trim();if(v)p[key]=v;else delete p[key];render()};f.appendChild(i);return f};
    cg.append(mkf('의뢰인','client','닉네임이나 이름'),mkf('연락 메모','contact','예: 트위터 DM, 오픈채팅'),mkf('의뢰 내용','brief','인원, 구도, 배경, 확인받을 시점 같은 요청 사항',true));h.appendChild(cg)}
  m.appendChild(h);
  // 요약
  const s=el('section','card');const sm=el('div','sum');
  const dd=el('div','dday',ddText(st.left));dd.appendChild(el('small','',md(p.due)+' 마감 · 작업일 '+P.N+'일'));
  const sv=el('div','stat');const pill=el('span','pill '+st.kind,st.text);
  const now=el('div','now');if(st.cur){now.append('지금 할 단계: ');now.appendChild(el('b','',st.cur.s.name));now.append(' · '+md(st.cur.end)+'까지 ('+ddText(diff(today(),st.cur.end))+')');if(/컨펌|확인받/.test(st.cur.s.name))now.appendChild(el('span','wait','상대 확인 기다리는 단계'))}else now.textContent=st.actual>=0.999?'수고했어요!':'';
  const pr=el('div','prog');const pi=el('i');pi.style.width=Math.round(st.actual*100)+'%';pr.appendChild(pi);
  if(today()>=p.start&&today()<=p.due){const ex=el('em');ex.style.left='calc('+(st.expected*100).toFixed(1)+'% - 1px)';pr.appendChild(ex)}
  const lg=el('div','legend');lg.append(el('span','','진행 '+Math.round(st.actual*100)+'%'),el('span','exp','오늘까지 계획 '+Math.round(st.expected*100)+'%'));
  sv.append(pill,now,pr,lg);sm.append(dd,sv);s.appendChild(sm);
  // 타임라인
  const tl=el('div','tl');const bar=el('div','tlbar');
  P.rows.forEach(r=>{const g=el('div','seg'+(r.s.done?' done':''));g.style.flex=r.n+' 1 0';g.title=r.s.name+' · '+md(r.start)+'~'+md(r.end);
    const f=el('i','fill');f.style.width=(r.s.done?100:Math.min(100,+r.s.pct||0))+'%';g.append(f,el('span','',r.s.name));bar.appendChild(g)});
  tl.appendChild(bar);
  const t=today();if(t>=p.start&&t<=p.due&&P.N){let ti=P.days.findIndex(d=>d>=t);if(ti<0)ti=P.N-1;const n=el('div','tlnow');n.style.left='calc('+((ti+0.5)/P.N*100).toFixed(2)+'% - 1px)';tl.appendChild(n)}
  const ax=el('div','tlax');ax.append(el('span','',md(p.start)),el('span','',md(p.due)));tl.appendChild(ax);
  s.appendChild(tl);m.appendChild(s);
  // 단계
  const c=el('section','card');const sh=el('div','sh');sh.append(el('h2','','단계'),el('span','','비중이 클수록 기간을 길게 잡아요. 비중을 바꾸면 날짜가 다시 계산돼요.'));c.appendChild(sh);
  const ch=el('div','colh');['','단계','비중','기간','진행',''].forEach(x=>ch.appendChild(el('span','',x)));c.appendChild(ch);
  const box=el('div','stages');
  P.rows.forEach((r,i)=>{const x=r.s;const row=el('div','st'+(st.cur&&st.cur.s===x?' cur':'')+(x.done?' isdone':''));
    row.appendChild(el('span','no',x.done?'✓':String(i+1)));
    const ni=el('input');ni.type='text';ni.value=x.name;ni.setAttribute('aria-label',(i+1)+'단계 이름');ni.onchange=()=>{x.name=ni.value.trim()||x.name;render()};
    const wi=el('input');wi.type='number';wi.min='1';wi.max='999';wi.value=x.w;wi.setAttribute('aria-label',x.name+' 비중');wi.onchange=()=>{const v=Math.max(1,Math.min(999,Math.round(+wi.value)||1));x.w=v;render()};
    const wh=el('div','when');const late=!x.done&&today()>r.end;wh.append(document.createTextNode(md(r.start)+' ~ '+md(r.end)));const sub=el('small','',r.n+'일'+(late?' · ':''));if(late)sub.appendChild(el('span','late','기한 지남'));wh.appendChild(sub);
    const pc=el('div','pc');const rg=el('input');rg.type='range';rg.min='0';rg.max='100';rg.step='10';rg.value=x.done?100:(+x.pct||0);rg.setAttribute('aria-label',x.name+' 진행률');
    const out=el('output','',rg.value+'%');rg.oninput=()=>{out.textContent=rg.value+'%'};rg.onchange=()=>{x.pct=+rg.value;x.done=x.pct>=100;render()};
    const dk=el('label','donechk');const dc=el('input');dc.type='checkbox';dc.checked=!!x.done;dc.onchange=()=>{x.done=dc.checked;x.pct=dc.checked?100:Math.min(+x.pct||0,90);render()};dk.append(dc,document.createTextNode('완료'));
    pc.append(rg,out,dk);
    const ops=el('div','ops');const up=el('button','ic','↑');up.disabled=!i;up.setAttribute('aria-label',x.name+' 위로');up.onclick=()=>{[p.stages[i-1],p.stages[i]]=[p.stages[i],p.stages[i-1]];render()};
    const dn=el('button','ic','↓');dn.disabled=i===P.rows.length-1;dn.setAttribute('aria-label',x.name+' 아래로');dn.onclick=()=>{[p.stages[i+1],p.stages[i]]=[p.stages[i],p.stages[i+1]];render()};
    const dl=el('button','ic del','×');dl.setAttribute('aria-label',x.name+' 삭제');dl.disabled=p.stages.length<=1;arm(dl,'삭제?',()=>{p.stages.splice(i,1);render()});
    ops.append(up,dn,dl);row.append(ni,wi,wh,pc,ops);box.appendChild(row)});
  c.appendChild(box);
  const add=el('button','btn sm addst','+ 단계 추가');add.onclick=()=>{p.stages.splice(Math.max(0,p.stages.length-(/여유/.test((p.stages[p.stages.length-1]||{}).name||'')?1:0)),0,{id:uid(),name:'새 단계',w:10,pct:0,done:false});render()};c.appendChild(add);
  m.appendChild(c);
  // 메모
  const mc=el('section','card');const msh=el('div','sh');msh.appendChild(el('h2','','메모'));mc.appendChild(msh);
  const ta=el('textarea','memo');ta.value=p.memo||'';ta.placeholder=p.type==='comm'?'파일 형식, 해상도, 전달 방법, 수정 요청 내용 같은 걸 적어 두세요.':'제출 형식, 교수님 피드백, 준비물 같은 걸 적어 두세요.';ta.setAttribute('aria-label','메모');ta.onchange=()=>{p.memo=ta.value;save()};mc.appendChild(ta);m.appendChild(mc);
  // 아래
  const ft=el('div','foot');const ics=el('button','btn','캘린더 파일(.ics) 받기');ics.onclick=()=>exportIcs(p);
  const cp=el('button','btn ghost','복사해서 새로 만들기');cp.onclick=()=>{const q=JSON.parse(JSON.stringify(p));q.id=uid();q.name=p.name+' (복사)';delete q.sample;q.stages.forEach(s=>{s.id=uid();s.pct=0;s.done=false});S.projects.push(q);S.cur=q.id;render();toast('복사했어요','good')};
  const dp=el('button','delp','이 일정 삭제');arm(dp,'한 번 더 누르면 삭제',()=>{S.projects=S.projects.filter(x=>x!==p);S.cur=S.projects[0]?S.projects[0].id:null;render();toast('일정을 지웠어요')});
  ft.append(ics,cp,el('span','grow'),dp);m.appendChild(ft);
  if(!canSave){const w=el('p','',);w.style.cssText='color:var(--muted);font-size:13px;text-align:center;margin:-10px 0 30px';w.textContent='지금 화면에서는 저장되지 않아요. 파일을 받아서 열면 자동으로 저장돼요.';m.appendChild(w)}
}
function arm(btn,label,fn){const l=btn.textContent;btn.onclick=()=>{if(btn.classList.contains('arm')){btn.classList.remove('arm');btn.textContent=l;fn();return}btn.classList.add('arm');btn.textContent=label;setTimeout(()=>{if(btn.isConnected){btn.classList.remove('arm');btn.textContent=l}},2600)}}

// ---------- 새 일정 ----------
let nType='grad';
function drawPresets(){const b=$('#presets');b.textContent='';Object.entries(PRESETS).forEach(([k,v])=>{const x=el('button','preset');x.type='button';x.setAttribute('aria-pressed',k===nType);x.append(el('b','',v.label),el('span','',v.desc));x.onclick=()=>{nType=k;drawPresets()};b.appendChild(x)});$('#nClientW').hidden=nType!=='comm';$('#nName').placeholder=nType==='comm'?'예: 캐릭터 일러스트 커미션':nType==='task'?'예: 콘텐츠기획 기말 리포트':'예: 졸업작품 웹툰 1화'}
function openNew(){nType='grad';$('#nClient').value='';drawPresets();$('#nName').value='';$('#nStart').value=today();$('#nDue').value=addD(today(),30);$('#newov').hidden=false;setTimeout(()=>$('#nName').focus(),50)}
function closeNew(){$('#newov').hidden=true}
$('#newBtn').onclick=openNew;$('#nCancel').onclick=closeNew;
$('#newov').addEventListener('mousedown',e=>{if(e.target===$('#newov'))closeNew()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#newov').hidden)closeNew()});
$('#nOk').onclick=()=>{const st=$('#nStart').value,du=$('#nDue').value;if(!st||!du){toast('시작일과 마감일을 골라 주세요.','bad');return}if(du<st){toast('마감일은 시작일보다 뒤여야 해요.','bad');return}
  const pr=PRESETS[nType];const p={id:uid(),name:$('#nName').value.trim()||pr.label,type:nType,start:st,due:du,skipWeekend:false,memo:'',stages:pr.stages.map(([n,w])=>({id:uid(),name:n,w,pct:0,done:false}))};const cl=$('#nClient').value.trim();if(nType==='comm'&&cl)p.client=cl;
  S.projects.push(p);S.cur=p.id;S.view='list';closeNew();render();toast('일정을 만들었어요. 단계별 마감이 자동으로 잡혔어요.','good')};
$('#sampleDel').onclick=()=>{S.projects=S.projects.filter(p=>!p.sample);S.cur=S.projects[0]?S.projects[0].id:null;render();toast('예시를 지웠어요')};

// ---------- 파일 ----------
function dl(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
$('#bkBtn').onclick=()=>{dl('마감일정표_백업_'+today()+'.json',new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));toast('백업 파일을 받았어요','good')};
$('#ldBtn').onclick=()=>$('#ldIn').click();
$('#ldIn').onchange=async()=>{const f=$('#ldIn').files[0];$('#ldIn').value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.projects))throw 0;S=d;S.cur=S.projects[0]?S.projects[0].id:null;render();toast('불러왔어요','good')}catch(e){toast('이 파일은 불러올 수 없어요. 백업 받기로 만든 파일인지 확인해 주세요.','bad')}};
function exportIcs(p){const P=plan(p);const esc=t=>String(t).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//deadline-planner//KO','CALSCALE:GREGORIAN'];
  const ev=(id,title,d)=>{lines.push('BEGIN:VEVENT','UID:'+id+'@deadline-planner','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d.replace(/-/g,''),'DTEND;VALUE=DATE:'+addD(d,1).replace(/-/g,''),'SUMMARY:'+esc(title),'END:VEVENT')};
  P.rows.forEach(r=>{if(!/여유/.test(r.s.name))ev(r.s.id,'['+p.name+'] '+r.s.name+' 마감',r.end)});ev(p.id,'['+p.name+'] 최종 마감',p.due);
  lines.push('END:VCALENDAR');dl((p.name||'일정').replace(/[\\/:*?"<>|]/g,'')+'.ics',new Blob([lines.join('\r\n')],{type:'text/calendar'}));toast('캘린더 파일을 받았어요. 구글 캘린더 등에서 가져오기로 넣을 수 있어요.','good')}
// ---------- 위젯 ----------
const WMODE=/[?&#]widget\b/.test(location.search+location.hash);if(WMODE)document.body.classList.add('wmode');
function renderMini(){const box=$('#mini');box.textContent='';const t=today();const td=pd(t);
  const c=el('section','card');const top=el('div','mini-top');top.append(el('b','',(td.getMonth()+1)+'월 '+td.getDate()+'일 '+W[td.getDay()]+'요일'));c.appendChild(top);
  c.appendChild(el('div','sh')).appendChild(el('h2','','오늘 할 일'));
  const ag=el('div','agenda');let n=0;
  [...S.projects].sort((a,b)=>a.due<b.due?-1:1).forEach(p=>{const st=status(p);if(st.actual>=0.999||t<p.start)return;n++;const r=el('button','ag');r.type='button';
    const dd=el('span','d'+(st.left<=7?' urgent':''),ddText(st.left));const ic=el('i');ic.style.background=colorOf(p);const tx=el('div');const b=el('b','',st.cur?st.cur.s.name:'마감 지남');tx.append(b,el('small','',p.name+(st.cur?' · '+md(st.cur.end)+'까지':'')+(st.kind==='bad'||st.kind==='warn'?' · '+st.text:'')));
    r.append(dd,ic,tx);r.onclick=()=>{if(WMODE)return;openProject(p)};ag.appendChild(r)});
  if(!n)ag.appendChild(el('p','dp-empty','진행 중인 일정이 없어요.'));c.appendChild(ag);box.appendChild(c);
  const c2=el('section','card');c2.appendChild(el('div','sh')).appendChild(el('h2','','다가오는 마감 (2주)'));const ag2=el('div','agenda');const end=addD(t,14);
  const evs=allEvents().filter(e=>e.date>=t&&e.date<=end&&!e.done).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  evs.forEach(e=>{const r=el('button','ag');r.type='button';const k=diff(t,e.date);const ic=el('i');ic.style.background=colorOf(e.p);const tx=el('div');tx.append(el('b','',e.label),el('small','',e.p.name));r.append(el('span','d'+(k<=2?' urgent':''),k===0?'오늘':md(e.date)),ic,tx);r.onclick=()=>{if(WMODE)return;openProject(e.p)};ag2.appendChild(r)});
  if(!evs.length)ag2.appendChild(el('p','dp-empty','2주 안에 마감이 없어요.'));c2.appendChild(ag2);box.appendChild(c2);
  if(WMODE){const x=el('a','btn sm ghost wexit','전체 화면으로 열기');x.href=location.pathname;x.target='_blank';box.appendChild(x)}
  else{const tip=el('p','dp-empty');tip.style.cssText='text-align:center;font-size:12.5px';tip.textContent='앱으로 설치한 뒤 이 화면을 띄워 두면 작은 창으로 오늘 할 일을 볼 수 있어요.';box.appendChild(tip)}}
// ---------- 색상 ----------
$('#palBtn').onclick=e=>{e.stopPropagation();const w=$('#palBtn').parentNode;const old=w.querySelector('.palpop');if(old){old.remove();$('#palBtn').setAttribute('aria-expanded','false');return}
  const pop=el('div','palpop');pop.setAttribute('role','menu');Object.entries(PALS).forEach(([k,v])=>{const o=el('button','palopt');o.type='button';o.setAttribute('aria-pressed',(S.palette||'basic')===k);o.appendChild(el('span','',v.name));const sw=el('span','sw');v.c.slice(0,5).forEach(c=>{const i=el('i');i.style.background=c;sw.appendChild(i)});o.appendChild(sw);
    o.onclick=()=>{S.palette=k;pop.remove();$('#palBtn').setAttribute('aria-expanded','false');render();toast(v.name+' 색상으로 바꿨어요')};pop.appendChild(o)});
  w.appendChild(pop);$('#palBtn').setAttribute('aria-expanded','true')};
document.addEventListener('click',e=>{const p=document.querySelector('.palpop');if(p&&!p.contains(e.target)){p.remove();$('#palBtn').setAttribute('aria-expanded','false')}});
// ---------- 앱 설치 ----------
let deferred=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if((location.protocol==='https:'||location.hostname==='localhost')&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone&&!WMODE)$('#installBar').hidden=false});
$('#installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();try{const r=await deferred.userChoice;if(r.outcome==='accepted'){$('#installBar').hidden=true;toast('설치했어요','good')}}catch(e){}deferred=null};
addEventListener('appinstalled',()=>{$('#installBar').hidden=true});
window.__planner={plan,status,S:()=>S};
render();
})();
</script>
