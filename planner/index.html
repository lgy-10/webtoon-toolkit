<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마감 역산 일정표</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a2b30">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<style>
/* 레이아웃: 위 일정 탭 → 요약(D-day·상태·진행률) → 타임라인 → 단계 표 → 메모 */
:root{
  --bg:#f5f5f6;--surface:#fff;--ink:#151517;--muted:#6e6e76;--line:#e4e4e8;--dark:#2a2b30;--seg1:#3a3b41;--seg2:#5b5c63;--good:#1f8a55;--warn:#c27a10;--bad:#c8333a;--soft:#eef3fc;--accent:#2f6fd6;--c1:#3d4f6b;--c2:#9a5a52;--c3:#4f7563;--c4:#8a7350;--c5:#6e5f86;--c6:#4f7480;--evtx:#fff;
  --f:"SUIT Variable","SUIT","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--fn:"SUIT Variable","SUIT","Apple SD Gothic Neo",sans-serif;--phead:#2a2b30;--phead-ink:#f4f4f6;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--surface:#1b1b1e;--ink:#ececf0;--muted:#9a9aa3;--line:#2c2c31;--dark:#2e2f35;--seg1:#4a4b52;--seg2:#63646c;--good:#3fbf7f;--warn:#e0a03a;--bad:#ef6a70;--soft:#1a2436;--accent:#6b9cf0;--c1:#8ea3c4;--c2:#c99189;--c3:#8fb39f;--c4:#c4ad84;--c5:#a99ac0;--c6:#8db0ba;--phead:#26262b;--phead-ink:#ececf0;--evtx:#111113;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;letter-spacing:-.005em;word-break:keep-all;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:8px;padding-block:18px 10px;flex-wrap:wrap}
header.top h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.02em;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:700;white-space:nowrap;transition:transform .12s,background-color .18s,border-color .18s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand,var(--ink));color:var(--brand-ink,var(--bg));border-color:var(--brand,var(--ink))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
@media (hover:hover){.btn:hover{border-color:var(--ink)}.btn.ghost:hover{border-color:transparent;color:var(--ink)}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
.ptab{flex-shrink:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px;font-weight:500;max-width:260px}
.ptab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptab .dd{white-space:nowrap;flex-shrink:0;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.ptab.on{background:var(--brand,var(--ink));color:var(--brand-ink,var(--bg));border-color:var(--brand,var(--ink))}
.ptab.on .dd{background:color-mix(in oklab,var(--bg) 18%,transparent);color:inherit}
.dd.urgent{color:var(--bad)!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.05)}
.card.sumcard{background:var(--phead);color:var(--phead-ink);border-color:var(--phead)}
.sumcard .now{color:rgba(244,244,246,.7)}.sumcard .now b{color:var(--phead-ink)}
.sumcard .legend{color:rgba(244,244,246,.6)}.sumcard .legend span::before{background:var(--phead-ink)}
.sumcard .prog{background:rgba(255,255,255,.1);border-color:transparent}.sumcard .prog i{background:var(--hi,var(--phead-ink))}
.sumcard .tlax{color:rgba(244,244,246,.55)}
.ptab .dd,.st .when,.pc output,.legend,.tlax,.day .dn,.todo-i .dd2,.dp-i em,.ag .d,.mini-top b,.calhead h2,.fld input[type=date],.st input[type=number]{font-family:var(--fn);font-variant-numeric:tabular-nums}
.head{display:flex;flex-direction:column;gap:12px}
.name{font-size:22px;font-weight:900;letter-spacing:-.02em;border:1px solid transparent;border-radius:8px;padding:4px 6px;margin:-4px -6px;background:transparent;width:100%;min-width:0}
.name:hover{border-color:var(--line)}.name:focus{outline:none;border-color:var(--ink);background:var(--bg)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand,var(--ink));border-color:var(--brand,var(--ink));color:var(--brand-ink,var(--bg));font-weight:700}
.dates{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:500;color:var(--ink);min-width:0}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;padding-bottom:9px;cursor:pointer;user-select:none}
.tog input{width:18px;height:18px;accent-color:var(--brand,var(--ink))}
.client{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.client .full{grid-column:1/-1}
.client textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14.5px;font-weight:500;color:var(--ink);min-height:64px;resize:vertical;line-height:1.6}
@media (max-width:560px){.client{grid-template-columns:minmax(0,1fr)}}
.wait{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 7px}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.dday{font-family:var(--fn);font-size:48px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.dday small{display:block;font-family:var(--f);font-size:13px;font-weight:500;color:rgba(244,244,246,.62);letter-spacing:0;margin-top:6px}
.stat{display:flex;flex-direction:column;gap:8px;min-width:0}
.pill{align-self:flex-start;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700;color:#fff;background:var(--good)}
.pill.idle{background:rgba(255,255,255,.18)!important}
.pill.warn{background:var(--warn)}.pill.bad{background:var(--bad)}.pill.idle{background:var(--muted)}
.now{font-size:14px;color:var(--muted)}
.now b{color:var(--ink)}
.prog{height:10px;border-radius:999px;background:var(--bg);overflow:hidden;position:relative;border:1px solid var(--line)}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--brand,var(--ink));border-radius:999px;transition:width .5s var(--ease)}
.prog em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--brand,var(--ink))}
.legend span.exp::before{width:2px;background:var(--bad)}
.tl{position:relative;margin-top:30px}
.tlbar{display:flex;height:36px;border-radius:8px;overflow:hidden;gap:3px}
.seg{position:relative;min-width:3px;background:rgba(255,255,255,.08);overflow:hidden;display:flex;align-items:center;padding:0 9px;color:rgba(244,244,246,.78);font-size:12px;font-weight:600;white-space:nowrap;border-radius:3px}
.seg:nth-child(even){background:rgba(255,255,255,.12)}
.seg.done{background:rgba(255,255,255,.88)!important;color:var(--phead)}
.seg .fill{position:absolute;left:0;bottom:0;top:auto;height:3px;background:var(--hi,var(--phead-ink))}
.seg.done .fill{display:none}
.seg span{position:relative;overflow:hidden;text-overflow:ellipsis}
.tlnow{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--bad);border-radius:2px}
.tlnow::after{content:"오늘";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--bad);white-space:nowrap}
.tlax{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.sh{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.sh h2{margin:0;font-size:16px;font-weight:900}
.sh span{font-size:12.5px;color:var(--muted)}
.stages{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:28px minmax(0,1.3fr) 76px minmax(0,1.5fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st.cur{background:linear-gradient(90deg,var(--tint,var(--soft)),transparent);border-radius:10px}
.st .no{font-size:13px;font-weight:900;color:var(--muted);text-align:center}
.st.cur .no{color:var(--accent)}
.st input[type=text],.st input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%;min-width:0;font-size:14.5px}
.st input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.st .when{font-size:13.5px;font-variant-numeric:tabular-nums;line-height:1.4}
.st .when small{display:block;color:var(--muted);font-size:12px}
.st .when .late{color:var(--bad);font-weight:700}
.pc{display:flex;align-items:center;gap:8px}
.pc input[type=range]{flex:1;min-width:0;accent-color:var(--brand,var(--ink))}
.pc output{font-size:13px;font-variant-numeric:tabular-nums;width:38px;text-align:right;color:var(--muted)}
.ops{display:flex;gap:2px}
.ic{border:0;background:transparent;color:var(--muted);border-radius:7px;width:30px;height:30px;font-size:14px}
.ic:hover{background:var(--bg);color:var(--ink)}
.ic:disabled{opacity:.3;cursor:default}
.ic.del.arm{background:var(--bad);color:#fff;width:auto;padding:0 8px;font-size:12px;font-weight:700}
.donechk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.donechk input{width:17px;height:17px;accent-color:var(--good)}
.st.isdone .no{color:var(--good)}
.addst{margin-top:10px}
.colh{display:grid;grid-template-columns:28px minmax(0,1.3fr) 76px minmax(0,1.5fr) minmax(0,1.2fr) auto;gap:10px;font-size:12px;color:var(--muted);font-weight:700;padding:0 0 6px;border-bottom:1px solid var(--line)}
@media (max-width:720px){
  header.top h1{flex-basis:100%}
  header.top .btn{padding:7px 11px;font-size:13.5px}
  .colh{display:none}
  .st{grid-template-columns:28px minmax(0,1fr) 72px;row-gap:8px}
  .st .when{grid-column:2/-1}
  .st .pc{grid-column:2/-1}
  .st .ops{grid-column:2/-1;justify-content:flex-end}
  .sum{grid-template-columns:minmax(0,1fr)}
  .dday{font-size:38px}
}
textarea.memo{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.7}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 30px}
.foot .grow{flex:1}
.delp{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px}
.delp.arm{color:#fff;background:var(--bad);text-decoration:none;border-radius:7px;font-weight:700}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:transparent;border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;color:var(--muted)}
.sample b{color:var(--ink)}
.sample span{flex:1;min-width:200px}
.newov{position:fixed;inset:0;z-index:20;background:rgba(10,10,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 14px 20px;overflow-y:auto}
.newbox{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;padding:18px;display:flex;flex-direction:column;gap:14px;animation:up .28s var(--ease)}
.newbox h2{margin:0;font-size:17px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.presets .preset:last-child:nth-child(odd){grid-column:1/-1}
.preset{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.preset b{font-size:15px}
.preset span{font-size:12.5px;color:var(--muted);line-height:1.5}
.preset[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.viewseg{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:3px;margin:2px 0 12px}
.viewseg button{border:0;background:transparent;border-radius:8px;padding:6px 18px;font-size:14px;font-weight:700;color:var(--muted)}
.viewseg button.on{background:var(--brand,var(--ink));color:var(--brand-ink,var(--bg))}
.todo{display:flex;flex-direction:column;gap:8px}
.todo-i{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg);text-align:left;width:100%}
.todo-i .cl{width:10px;height:36px;border-radius:5px}
.todo-i b{display:block;font-size:15px}
.todo-i span{font-size:13px;color:var(--muted)}
.todo-i .dd2{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.todo-i .dd2.urgent{color:var(--bad)}
@media (hover:hover){.todo-i:hover{border-color:var(--ink)}}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{margin:0 auto 0 0;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-bottom:10px}
.legend2 button{border:0;background:transparent;padding:2px 0;display:flex;align-items:center;gap:6px;color:var(--ink)}
.legend2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend2 button[aria-pressed="false"]{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .wd{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.cal .wd.sun,.day.sun .dn{color:var(--bad)}.cal .wd.sat,.day.sat .dn{color:var(--accent)}
.day{min-height:104px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;cursor:pointer;position:relative}
.day.out{background:var(--bg)}.day.out .dn{opacity:.4}
.day .dn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.day.today .dn{background:var(--brand,var(--ink));color:var(--brand-ink,var(--bg))!important}
.day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.bars{display:flex;flex-direction:column;gap:2px}
.bars i{height:3px;border-radius:2px;display:block;opacity:.4}
.bars i.s{margin-left:40%}.bars i.e{margin-right:40%}
.chips2{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{font-size:11.5px;line-height:1.4;border-radius:3px;padding:1px 6px;color:var(--ink);background:color-mix(in oklab,var(--pc) 15%,var(--surface));box-shadow:inset 3px 0 0 var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.fin{background:var(--pc);color:#fff;box-shadow:none}
.ev.fin{font-weight:900}
.ev.dn2{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--muted);padding-left:3px}
.daypanel{margin-top:14px}
.daypanel h3{margin:0 0 10px;font-size:16px}
.dp-i{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-align:left;width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent}
.dp-i:first-of-type{border-top:0}
.dp-i .cl{width:10px;height:10px;border-radius:50%}
.dp-i b{font-size:14.5px}
.dp-i span{font-size:13px;color:var(--muted);display:block}
.dp-i em{font-style:normal;font-size:12.5px;font-weight:700;white-space:nowrap}
.dp-empty{color:var(--muted);font-size:14px}
@media (max-width:640px){
  .day{min-height:64px;padding:3px 2px}
  .day .dn{font-size:12px;width:21px;height:21px}
  .ev,.ev.fin{font-size:0;padding:0;height:5px;border-radius:3px;background:var(--pc);box-shadow:none}
  .more{display:none}
  .bars i{height:3px}
}
.palpop{position:absolute;right:0;top:calc(100% + 6px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:2px;min-width:230px;animation:up .2s var(--ease)}
.palopt{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;padding:8px 10px;text-align:left;font-size:14px;font-weight:500}
.palopt:hover{background:var(--bg)}
.palopt[aria-pressed="true"]{background:var(--bg);font-weight:900}
.palopt .sw{display:flex;gap:3px;margin-left:auto}
.palopt .sw i{width:14px;height:14px;border-radius:4px;display:block}
.getbtn{background:#2a2b30;color:#f4f4f6;border-color:#2a2b30;display:inline-flex;align-items:center;gap:2px}
.getbtn .ar{display:inline-block;transition:transform .18s}.getbtn .sm{display:none}
@media (hover:hover){.getbtn:hover{border-color:#2a2b30;transform:translateY(-1px)}.getbtn:hover .ar{transform:translateY(2px)}}
.getpop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:270px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column}
.getopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:transparent;border-radius:9px;padding:9px 10px;text-align:left;font-size:14px;font-weight:700;width:100%}
.getopt small{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.5}
.getopt:hover,.getlink:hover{background:var(--bg)}
.getsub{font-size:12px;font-weight:800;color:var(--muted);padding:10px 10px 0;border-top:1px solid var(--line);margin-top:4px}
.getsubd{display:block;font-size:12px;color:var(--muted);padding:2px 10px 4px;line-height:1.5}
.getlink{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none}
.getlink em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.getnote{font-size:12.5px;color:var(--muted);line-height:1.55;padding:8px 10px;border-top:1px solid var(--line);margin-top:4px}
.getwrap{order:9}
@media (max-width:560px){.getbtn .lg{display:none}.getbtn .sm{display:inline}.getwrap{order:0}header.top h1{flex:1 1 calc(100% - 110px)!important}.getpop{width:min(270px,calc(100vw - 32px))}}
.hwrap{position:relative}
.mini{max-width:440px;margin:0 auto}
.mini .card{padding:14px 16px}
.mini-top{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.mini-top b{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini-top span{color:var(--muted);font-size:14px}
.agenda{display:flex;flex-direction:column}
.ag{display:grid;grid-template-columns:54px 10px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;text-align:left;border-left:0;border-right:0;border-bottom:0;background:transparent;width:100%}
.ag:first-child{border-top:0}
.ag .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.ag .d.urgent{color:var(--bad)}
.ag i{width:10px;height:10px;border-radius:50%}
.ag b{font-weight:700}.ag small{color:var(--muted);font-size:12.5px;display:block}
.install{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;background:var(--surface)}
.install span{flex:1;min-width:200px;color:var(--muted)}
body.wmode header.top,body.wmode .viewseg,body.wmode #sample{display:none}
body.wmode .wrap{padding-top:10px}
.wexit{display:none}
.dhero{padding:18px 20px 16px}
.dh-top{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;min-width:0}
.dh-top i{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.dh-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh-type{font-size:11.5px;color:rgba(244,244,246,.55);font-weight:600}
.dh-num{font-size:clamp(64px,24vw,112px);font-weight:900;line-height:1;letter-spacing:-.05em;margin:14px 0 6px;font-variant-numeric:tabular-nums}
.dhero.hot .dh-num{color:#ff8a80}
.dh-due{font-size:13.5px;color:rgba(244,244,246,.72);font-weight:600}
.dh-prog{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font-size:12px;color:rgba(244,244,246,.6);font-variant-numeric:tabular-nums;font-weight:700}
.dh-bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.dh-bar i{display:block;height:100%;background:var(--hi,#f4f4f6);border-radius:99px}
.dh-now{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:11px 12px;border-radius:10px;background:rgba(255,255,255,.07)}
.dh-lab{font-size:11.5px;color:rgba(244,244,246,.55);font-weight:700;flex-basis:100%}
.dh-now b{font-size:17px;font-weight:800}
.dh-sd{font-size:12.5px;color:rgba(244,244,246,.7);font-variant-numeric:tabular-nums}
.dh-st{font-size:12.5px;font-weight:700;margin-top:10px;color:rgba(244,244,246,.7)}
.dh-st.warn{color:#ffd27a}.dh-st.bad{color:#ff8a80}
.drest{padding:6px 8px}
.dr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 8px;text-align:left;border-radius:0}
.dr:first-child{border-top:0}.dr:hover{background:var(--bg)}
.dr i{width:9px;height:9px;border-radius:50%}
.dr-tx{min-width:0}.dr-tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dr-tx small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-d{font-size:24px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.dr-d.hot{color:var(--bad)}
body.wmode .wrap{padding-left:10px;padding-right:10px}

.dbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:2px;height:38px;padding:0 6px 0 14px;background:var(--bg);-webkit-app-region:drag;user-select:none}
.dbar-t{flex:1;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{-webkit-app-region:no-drag;width:30px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:grid;place-items:center}
.dbtn:hover{background:var(--line);color:var(--ink)}
.dbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
body.desk.wmode .wrap{padding-top:0}
body.desk .getwrap,body.desk #installBar{display:none!important}
body.desk.wmode{overflow-y:auto}
body.desk.wmode::-webkit-scrollbar{width:8px}body.desk.wmode::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--bg)}body.desk.wmode::-webkit-scrollbar-track{background:transparent}

body.wmode .wexit{display:inline-flex;margin:0 auto 10px}
.savest{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px;min-height:1.2em}
.savest.off{color:var(--warn)}
.nudge{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:10px;padding:10px 12px 10px 14px;font-size:13.5px;margin-bottom:12px}
.nudge span{flex:1;min-width:200px}
.undobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:9px 10px 9px 16px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);animation:up .25s var(--ease)}
.undobar button{border:0;border-radius:7px;padding:6px 12px;font-weight:700;font-size:13px;background:var(--good);color:#fff}
.donetog{flex-shrink:0;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.dpadd{margin-top:10px}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 26px}
.kbd b{font-family:var(--fn);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface);color:var(--ink);font-weight:600}
@media (hover:none){.kbd{display:none}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{animation:up .4s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>마감 역산 일정표 <small id="saveSt" class="savest"></small></h1>
    <span class="hwrap getwrap"><button class="btn getbtn" id="getBtn" aria-haspopup="true" aria-expanded="false"><span class="ar">↓</span> <span class="lg">프로그램 받기</span><span class="sm">받기</span></button></span>
    <button class="btn primary" id="newBtn">+ 새 일정</button>
    <button class="btn" id="bkBtn">백업 받기</button>
    <button class="btn" id="ldBtn">불러오기</button>
    <span class="hwrap"><button class="btn" id="palBtn" aria-haspopup="true" aria-expanded="false">색상</button></span>
    <input type="file" id="ldIn" accept=".json,application/json" hidden>
  </header>
  <div class="viewseg" role="group" aria-label="보기 방식"><button type="button" data-v="cal">달력</button><button type="button" data-v="list">일정별</button><button type="button" data-v="mini">위젯</button></div>
  <div class="install" id="installBar" hidden><span id="installTxt">앱으로 설치하면 바탕화면이나 홈 화면에서 바로 열 수 있어요.</span><button class="btn sm primary" id="installBtn">앱으로 설치</button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="일정 목록"></div>
  <div class="nudge" id="nudge" hidden><span id="nudgeTxt"></span><button class="btn sm primary" id="nudgeBk">백업 받기</button><button class="btn sm ghost" id="nudgeLater">나중에</button></div>
  <div id="sample" class="sample" hidden><span>처음 열면 보이는 <b>예시 일정</b>이에요. 둘러본 다음 지우고 내 일정을 만들어 주세요.</span><button class="btn sm" id="sampleDel">예시 지우기</button></div>
  <main id="main"></main>
  <main id="cal" hidden></main>
  <main id="mini" class="mini" hidden></main>
</div>

<div class="newov" id="newov" hidden role="dialog" aria-modal="true" aria-labelledby="nTitle">
  <div class="newbox">
    <h2 id="nTitle">새 일정 만들기</h2>
    <div class="presets" id="presets"></div>
    <label class="fld">이름<input id="nName" placeholder="예: 졸업작품 웹툰 1화"></label>
    <label class="fld" id="nClientW" hidden>의뢰인<input id="nClient" placeholder="닉네임이나 이름"></label>
    <div class="dates">
      <label class="fld">시작일<input type="date" id="nStart"></label>
      <label class="fld">마감일<input type="date" id="nDue"></label>
    </div>
    <div class="foot" style="margin:0"><span class="grow"></span><button class="btn ghost" id="nCancel">취소</button><button class="btn primary" id="nOk">만들기</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="undobar" id="undoBar" hidden><span id="undoTxt"></span><button id="undoBtn">되돌리기</button></div>

<script>
(function(){
const KEY='deadline-planner-v1';
const PRESETS={
  grad:{label:'졸업작품',desc:'몇 달짜리 웹툰·애니 졸작',stages:[['기획·시나리오',15],['콘티',20],['선화',25],['채색',22],['식자·후보정',10],['여유 기간',8]]},
  work:{label:'과제작',desc:'단편 만화·애니 같은 작품 과제',stages:[['기획',15],['콘티',25],['작화',40],['마무리',12],['여유 기간',8]]},
  task:{label:'과제물',desc:'리포트·기획안·발표 자료',stages:[['자료 조사',30],['초안 작성',35],['수정',20],['제출 준비',8],['여유 기간',7]]},
  comm:{label:'커미션',desc:'의뢰받은 그림·만화 작업',stages:[['문의·자료 확인',8],['러프',15],['러프 컨펌',8],['선화',22],['채색',25],['수정',12],['납품',5],['여유 기간',5]]},
  custom:{label:'직접 만들기',desc:'단계를 내 마음대로',stages:[['1단계',34],['2단계',33],['3단계',33]]}
};
const TYPES={grad:'졸업작품',work:'과제작',task:'과제물',comm:'커미션',custom:'기타'};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
let tT;function toast(m,k){const t=$('#toast');t.textContent=m;t.className='toast'+(k?' '+k:'');t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2400)}

// ---------- 날짜 ----------
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1,12)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const W=['일','월','화','수','목','금','토'];
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+W[d.getDay()]+')'};

// ---------- 저장 ----------
let S=null,canSave=true;
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.projects))return d}}catch(e){canSave=false}return null}
function hm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function save(){const st=document.getElementById('saveSt');if(canSave){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canSave=false}}
  if(st){st.className='savest'+(canSave?'':' off');st.textContent=canSave?'자동 저장됨 · '+hm():'지금 화면에서는 저장되지 않아요'}}
let undoSnap=null,undoT=null;
function snap(){return JSON.stringify(S)}
function offerUndo(label,before){undoSnap=before;$('#undoTxt').textContent=label;$('#undoBar').hidden=false;clearTimeout(undoT);undoT=setTimeout(()=>{$('#undoBar').hidden=true;undoSnap=null},7000)}
function sampleData(){const t=today();
  const mk=(type,name,start,due,prog)=>({id:uid(),name,type,start,due,skipWeekend:false,memo:'',sample:true,stages:PRESETS[type].stages.map(([n,w],i)=>({id:uid(),name:n,w,pct:prog[i]||0,done:(prog[i]||0)>=100}))});
  return {v:1,cur:null,projects:[mk('grad','예시: 졸업작품 웹툰',addD(t,-40),addD(t,95),[100,60,0,0,0,0]),mk('task','예시: 콘텐츠기획 기말 리포트',addD(t,-3),addD(t,11),[70,0,0,0,0]),Object.assign(mk('comm','예시: 캐릭터 일러스트 커미션',addD(t,-6),addD(t,14),[100,100,40,0,0,0,0,0]),{client:'예시 의뢰인',contact:'DM으로 연락',brief:'전신 1인, 배경 없음, 러프 단계에서 한 번 확인받기로 함'})]}}
S=load()||sampleData();if(!S.firstUse)S.firstUse=today();if(!S.cur||!S.projects.some(p=>p.id===S.cur))S.cur=S.projects[0]?S.projects[0].id:null;

// ---------- 계산 ----------
function workDays(p){const out=[];const n=diff(p.start,p.due);if(n<0)return out;for(let i=0;i<=n;i++){const s=addD(p.start,i);const wd=pd(s).getDay();if(!p.skipWeekend||(wd!==0&&wd!==6))out.push(s)}if(!out.length&&n>=0)out.push(p.due);return out}
function plan(p){const days=workDays(p);const N=days.length;const tw=p.stages.reduce((a,s)=>a+Math.max(0,+s.w||0),0)||1;
  let cum=0,prevEnd=-1;const rows=p.stages.map((s,i)=>{cum+=Math.max(0,+s.w||0);let end=Math.round(cum/tw*N)-1;if(i===p.stages.length-1)end=N-1;
    let start=prevEnd+1;if(end<start)end=start;if(start>N-1){start=N-1;end=N-1}if(end>N-1)end=N-1;prevEnd=end;
    return {s,start:days[start],end:days[end],si:start,ei:end,n:end-start+1}});
  return {days,N,tw,rows}}
function status(p){const P=plan(p);const t=today();const tw=P.tw;
  const actual=p.stages.reduce((a,s)=>a+Math.max(0,+s.w||0)*(s.done?1:Math.min(100,+s.pct||0)/100),0)/tw;
  let ti=P.days.findIndex(d=>d>t);if(ti<0)ti=P.N;  // 오늘까지 지난 작업일 수
  let expected=0;P.rows.forEach(r=>{const w=Math.max(0,+r.s.w||0);const passed=Math.max(0,Math.min(r.n,ti-r.si));expected+=w*passed/r.n});expected/=tw;
  const lagDays=(expected-actual)*P.N;
  const cur=P.rows.find(r=>t>=r.start&&t<=r.end&&!r.s.done)||P.rows.find(r=>!r.s.done&&r.start>t)||null;
  const left=diff(t,p.due);
  let kind='good',text='계획대로 가고 있어요';
  if(actual>=0.999){kind='good';text='모든 단계를 끝냈어요'}
  else if(t<p.start){kind='idle';text='아직 시작 전이에요'}
  else if(left<0){kind='bad';text='마감일이 지났어요'}
  else if(lagDays>=3){kind='bad';text='계획보다 약 '+Math.round(lagDays)+'일 늦어요'}
  else if(lagDays>=1){kind='warn';text='계획보다 약 '+Math.round(lagDays)+'일 늦어요'}
  else if(lagDays<=-1){kind='good';text='계획보다 약 '+Math.round(-lagDays)+'일 앞서 있어요'}
  return {P,actual,expected,lagDays,cur,left,kind,text}}
const ddText=n=>n>0?'D-'+n:n===0?'D-day':'D+'+(-n);

// ---------- 그리기 ----------
function cur(){return S.projects.find(p=>p.id===S.cur)||null}
function render(){save();applyPal();S.view=S.view||'cal';const v=WMODE?'mini':S.view,list=v==='list';
  document.querySelectorAll('.viewseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#tabs').hidden=!list;$('#main').hidden=!list;$('#cal').hidden=v!=='cal';$('#mini').hidden=v!=='mini';
  if(v==='cal')renderCal();else if(v==='mini')renderMini();else{renderTabs();renderMain()}
  $('#sample').hidden=!S.projects.some(p=>p.sample);renderNudge()}
document.querySelectorAll('.viewseg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
// ---------- 달력 ----------
const PALS={
  basic:{name:'기본',brand:'',hi:'',c:['#3d4f6b','#9a5a52','#4f7563','#8a7350','#6e5f86','#4f7480']},
  dusk:{name:'노을빛',brand:'#3E5A78',hi:'#EEB59B',c:['#3E5A78','#E57A7F','#6A5672','#E9A285','#B26D7E','#D98A5F']},
  sea:{name:'바다',brand:'#1F3550',hi:'#82A9C1',c:['#1F3550','#82A9C1','#4F9A8E','#5D83A3','#2C4A6C','#8FCAB6']},
  vintage:{name:'빈티지',brand:'#5C7553',hi:'#ECBE74',c:['#5C7553','#D8856F','#779892','#E3B163','#B9817C','#8A7A5C']},
  pop:{name:'팝',brand:'#DB3B7B',hi:'#F8E86B',c:['#DB3B7B','#3FB5B4','#EF6466','#D9B32B','#3D7BB8','#F08A4B']},
  pastel:{name:'파스텔',brand:'#8579C9',hi:'#C9C2F7',c:['#9B8FE0','#F2A7A3','#8FCFA6','#E3C772','#A7B9F2','#E3A3D3']}};
const lum=h=>{const n=parseInt(h.slice(1),16);const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255)};
const textOn=h=>lum(h)>.42?'#17181b':'#ffffff';
const OLDPAL={vivid:'pop',forest:'vintage',sunset:'dusk'};
function pal(){if(OLDPAL[S.palette])S.palette=OLDPAL[S.palette];return PALS[S.palette]||PALS.basic}
function applyPal(){const P=pal(),r=document.documentElement.style;if(P.brand){r.setProperty('--brand',P.brand);r.setProperty('--brand-ink',textOn(P.brand));r.setProperty('--tint',P.brand+'1f')}else{r.removeProperty('--brand');r.removeProperty('--brand-ink');r.removeProperty('--tint')}
  if(P.hi)r.setProperty('--hi',P.hi);else r.removeProperty('--hi');P.c.forEach((c,i)=>r.setProperty('--c'+(i+1),c));const tm=document.querySelector('meta[name=theme-color]');if(tm)tm.content=P.brand||'#2a2b30'}
const colorOf=p=>{const i=S.projects.indexOf(p);return pal().c[(p.color!=null?p.color:i)%6]};
let calY=null,calM=null,selDay=today();const hidden=new Set();
function allEvents(){const ev=[];S.projects.forEach(p=>{if(hidden.has(p.id))return;const P=plan(p);

function doBackup(){S.lastBackup=today();save();renderNudge();dl('마감일정표_백업_'+today()+'.json',new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));toast('백업 파일을 받았어요','good')}
$('#bkBtn').onclick=doBackup;$('#nudgeBk').onclick=doBackup;
$('#nudgeLater').onclick=()=>{S.snooze=addD(today(),3);save();renderNudge()};
function renderNudge(){const real=S.projects.some(p=>!p.sample);const base=S.lastBackup||S.firstUse||today();const n=diff(base,today());const show=canSave&&real&&n>=7&&!(S.snooze&&S.snooze>today());$('#nudge').hidden=!show;if(show)$('#nudgeTxt').textContent=(S.lastBackup?'마지막 백업이 '+n+'일 전이에요.':'아직 백업한 적이 없어요.')+' 브라우저 기록을 지우면 일정이 사라질 수 있어요.'}
$('#ldBtn').onclick=()=>$('#ldIn').click();
$('#ldIn').onchange=async()=>{const f=$('#ldIn').files[0];$('#ldIn').value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.projects))throw 0;S=d;S.cur=S.projects[0]?S.projects[0].id:null;render();toast('불러왔어요','good')}catch(e){toast('이 파일은 불러올 수 없어요. 백업 받기로 만든 파일인지 확인해 주세요.','bad')}};
function exportIcs(p){const P=plan(p);const esc=t=>String(t).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//deadline-planner//KO','CALSCALE:GREGORIAN'];
  const ev=(id,title,d)=>{lines.push('BEGIN:VEVENT','UID:'+id+'@deadline-planner','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d.replace(/-/g,''),'DTEND;VALUE=DATE:'+addD(d,1).replace(/-/g,''),'SUMMARY:'+esc(title),'END:VEVENT')};
  P.rows.forEach(r=>{if(!/여유/.test(r.s.name))ev(r.s.id,'['+p.name+'] '+r.s.name+' 마감',r.end)});ev(p.id,'['+p.name+'] 최종 마감',p.due);
  lines.push('END:VCALENDAR');dl((p.name||'일정').replace(/[\\/:*?"<>|]/g,'')+'.ics',new Blob([lines.join('\r\n')],{type:'text/calendar'}));toast('캘린더 파일을 받았어요. 구글 캘린더 등에서 가져오기로 넣을 수 있어요.','good')}
// ---------- 위젯 ----------
const DESK=window.desktop||null;const WMODE=/[?&#]widget\b/.test(location.search+location.hash);if(WMODE)document.body.classList.add('wmode');
function renderMini(){const box=$('#mini');box.textContent='';const t=today();
  const act=[...S.projects].filter(p=>status(p).actual<0.999).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
  if(!act.length){const c=el('section','card');c.appendChild(el('p','dp-empty','진행 중인 일정이 없어요.'));box.appendChild(c)}
  else{const hero=act.find(p=>p.id===S.wHero)||act[0];const st=status(hero);const L=st.left;
    const h=el('section','card sumcard dhero'+(L<=7?' hot':'')+(L<0?' over':''));
    const top=el('div','dh-top');const dot=el('i');dot.style.background=colorOf(hero);top.append(dot,el('span','dh-name',hero.name||'이름 없는 일정'),el('span','dh-type',TYPES[hero.type]||''));h.appendChild(top);
    h.appendChild(el('div','dh-num',ddText(L)));
    h.appendChild(el('div','dh-due',L<0?md(hero.due)+' 마감이 지났어요':L===0?'오늘이 마감이에요':md(hero.due)+' 마감 · '+L+'일 남았어요'));
    const pr=el('div','dh-prog');const bar=el('div','dh-bar');const fill=el('i');fill.style.width=Math.round(st.actual*100)+'%';bar.appendChild(fill);pr.append(bar,el('span','',Math.round(st.actual*100)+'%'));h.appendChild(pr);
    const now=el('div','dh-now');
    if(st.cur){const k=diff(t,st.cur.end);now.append(el('span','dh-lab','지금 할 단계'),el('b','',st.cur.s.name),el('span','dh-sd',md(st.cur.end)+'까지 · '+(k>0?k+'일 남음':k===0?'오늘까지':(-k)+'일 지남')))}
    else now.append(el('span','dh-lab','남은 단계 없음'));
    h.appendChild(now);
    h.appendChild(el('div','dh-st '+st.kind,st.text));
    if(!WMODE){h.style.cursor='pointer';h.onclick=()=>openProject(hero)}
    box.appendChild(h);
    const rest=act.filter(p=>p!==hero);
    if(rest.length){const c=el('section','card drest');rest.forEach(p=>{const s2=status(p);const r=el('button','dr');r.type='button';const ic=el('i');ic.style.background=colorOf(p);
        const tx=el('div','dr-tx');tx.append(el('b','',p.name||'이름 없는 일정'),el('small','',s2.cur?s2.cur.s.name+' · '+md(s2.cur.end)+'까지':md(p.due)+' 마감'));
        r.append(ic,tx,el('span','dr-d'+(s2.left<=7?' hot':''),ddText(s2.left)));r.title=WMODE?'크게 보기':'열기';
        r.onclick=()=>{if(WMODE){S.wHero=p.id;save();renderMini()}else openProject(p)};c.appendChild(r)});box.appendChild(c)}}
  if(WMODE){if(!DESK){const x=el('a','btn sm ghost wexit','전체 화면으로 열기');x.href=location.pathname;x.target='_blank';box.appendChild(x)}}
  else{const tip=el('p','dp-empty');tip.style.cssText='text-align:center;font-size:12.5px';tip.textContent=DESK?'위에 있는 위젯 띄우기를 누르면 바탕화면에 작은 창으로 띄울 수 있어요.':'앱으로 설치한 뒤 이 화면을 띄워 두면 작은 창으로 오늘 할 일을 볼 수 있어요.';box.appendChild(tip)}}
// ---------- PC 위젯 프로그램 ----------
if(DESK){document.body.classList.add('desk');
  if(WMODE){const bar=el('div','dbar');const t=el('span','dbar-t','마감 역산 일정표');
    const pin=el('button','dbtn');pin.type='button';pin.title='항상 위에 고정';pin.innerHTML='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.6 1.5l4.9 4.9-1.3.4-2.3 2.3.3 3.1-1.2 1.2-2.6-2.6-3.6 3.6-.9-.9 3.6-3.6-2.6-2.6 1.2-1.2 3.1.3 2.3-2.3z" fill="currentColor"/></svg>';
    const setPin=v=>{pin.setAttribute('aria-pressed',v?'true':'false');pin.title=v?'고정 풀기':'항상 위에 고정'};
    pin.onclick=async()=>{setPin(await DESK.togglePin())};DESK.getPin().then(setPin);DESK.onPin&&DESK.onPin(setPin);
    const full=el('button','dbtn');full.type='button';full.title='전체 창 열기';full.innerHTML='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9 2h5v5h-1.5V4.6L9 8.1 7.9 7l3.5-3.5H9zM2 9h1.5v2.4L7 7.9 8.1 9l-3.5 3.5H7V14H2z" fill="currentColor"/></svg>';full.onclick=()=>DESK.openMain();
    const x=el('button','dbtn');x.type='button';x.title='위젯 숨기기';x.innerHTML='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4.1 3L8 6.9 11.9 3 13 4.1 9.1 8l3.9 3.9-1.1 1.1L8 9.1 4.1 13 3 11.9 6.9 8 3 4.1z" fill="currentColor"/></svg>';x.onclick=()=>DESK.hideWidget();
    bar.append(t,pin,full,x);document.body.prepend(bar);
    addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const d=JSON.parse(e.newValue);if(d&&Array.isArray(d.projects)){S=d;renderMini();applyPal()}}catch(err){}});
    let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();renderMini()}},60000);
  }else{const b=el('button','btn','위젯 띄우기');b.type='button';b.id='deskW';b.onclick=()=>DESK.showWidget();$('#palBtn').parentNode.after(b)}}

// ---------- 색상 ----------
$('#palBtn').onclick=e=>{e.stopPropagation();const w=$('#palBtn').parentNode;const old=w.querySelector('.palpop');if(old){old.remove();$('#palBtn').setAttribute('aria-expanded','false');return}
  const pop=el('div','palpop');pop.setAttribute('role','menu');Object.entries(PALS).forEach(([k,v])=>{const o=el('button','palopt');o.type='button';o.setAttribute('aria-pressed',(S.palette||'basic')===k);o.appendChild(el('span','',v.name));const sw=el('span','sw');v.c.slice(0,5).forEach(c=>{const i=el('i');i.style.background=c;sw.appendChild(i)});o.appendChild(sw);
    o.onclick=()=>{S.palette=k;pop.remove();$('#palBtn').setAttribute('aria-expanded','false');render();toast(v.name+' 색상으로 바꿨어요')};pop.appendChild(o)});
  w.appendChild(pop);$('#palBtn').setAttribute('aria-expanded','true')};
document.addEventListener('click',e=>{const p=document.querySelector('.palpop');if(p&&!p.contains(e.target)){p.remove();$('#palBtn').setAttribute('aria-expanded','false')}});
// ---------- 앱 설치 ----------
let deferred=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if((location.protocol==='https:'||location.hostname==='localhost')&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone&&!WMODE)$('#installBar').hidden=false});
$('#installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();try{const r=await deferred.userChoice;if(r.outcome==='accepted'){$('#installBar').hidden=true;toast('설치했어요','good')}}catch(e){}deferred=null};
addEventListener('appinstalled',()=>{$('#installBar').hidden=true});
function closeGet(){const p=document.querySelector('.getpop');if(p){p.remove();$('#getBtn').setAttribute('aria-expanded','false')}}
async function getFile(){closeGet();let src=null;
  try{if(location.protocol!=='file:'){const r=await fetch(location.pathname,{cache:'no-cache'});if(r.ok){const t=await r.text();if(t.includes('마감 역산 일정표'))src=t}}}catch(e){}
  if(!src&&location.protocol!=='file:'){try{const r=await fetch('../download/deadline-planner.html');if(r.ok)src=await r.text()}catch(e){}}
  if(!src){toast(location.protocol==='file:'?'지금 열어 둔 이 파일이 바로 프로그램이에요':'파일을 못 가져왔어요. 잠시 뒤 다시 해 주세요','bad');return}
  dl('deadline-planner.html',new Blob([src],{type:'text/html'}));toast('파일을 받았어요. 더블클릭하면 열려요','good')}
async function getInstall(){closeGet();if(!deferred)return;deferred.prompt();try{const r=await deferred.userChoice;if(r.outcome==='accepted'){$('#installBar').hidden=true;toast('설치했어요','good')}}catch(e){}deferred=null}
$('#getBtn').onclick=e=>{e.stopPropagation();if(document.querySelector('.getpop')){closeGet();return}
  const pop=document.createElement('div');pop.className='getpop';pop.setAttribute('role','menu');
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const add=(t,d,f)=>{const b=document.createElement('button');b.type='button';b.className='getopt';b.setAttribute('role','menuitem');b.innerHTML='<span>'+t+'</span><small>'+d+'</small>';b.onclick=ev=>{ev.stopPropagation();f()};pop.appendChild(b)};
  if(standalone){}else if(deferred)add('앱으로 설치','바탕화면이나 홈 화면에 아이콘이 생겨요. 인터넷 없어도 열려요.',getInstall);
  add('파일로 받기 (.html)','PC에 저장해 두고 더블클릭해서 열어요. 일정은 그 파일을 연 브라우저에 저장돼요.',getFile);
  const wl=el('div','getsub','PC 위젯 프로그램');pop.appendChild(wl);const wd=el('small','getsubd','바탕화면에 작은 창으로 띄워 두고, 컴퓨터를 켜면 자동으로 떠요.');pop.appendChild(wd);
  const isMac=/Mac/i.test(navigator.platform||navigator.userAgent);
  [['윈도우','DeadlinePlanner-Windows.zip',!isMac],['맥 (M1~M4 칩)','DeadlinePlanner-Mac-AppleSilicon.zip',isMac],['맥 (인텔)','DeadlinePlanner-Mac-Intel.zip',false]].forEach(([n,f,mine])=>{const a=el('a','getlink');a.href='https://github.com/lgy-10/webtoon-toolkit/releases/latest/download/'+f;a.target='_blank';a.rel='noopener';a.setAttribute('role','menuitem');a.append(document.createTextNode('↓ '+n));if(mine)a.append(el('em','','내 컴퓨터'));a.onclick=()=>closeGet();pop.appendChild(a)});
  const n=document.createElement('div');n.className='getnote';
  n.textContent=standalone?'지금 앱으로 열려 있어요.':deferred?'설치한 앱과 받은 파일은 저장 공간이 따로라서, 옮길 땐 백업 받기 → 불러오기를 써 주세요.':ios?'아이폰은 Safari 아래 공유 버튼 → 홈 화면에 추가를 누르면 앱처럼 쓸 수 있어요.':'설치 버튼이 안 보이면 브라우저 메뉴(⋮)에서 앱 설치나 홈 화면에 추가를 눌러 주세요.';
  pop.appendChild(n);$('#getBtn').parentNode.appendChild(pop);$('#getBtn').setAttribute('aria-expanded','true')};
document.addEventListener('click',e=>{const p=document.querySelector('.getpop');if(p&&!p.contains(e.target))closeGet()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeGet()});

addEventListener('keydown',e=>{const tg=e.target;if(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;if(!$('#newov').hidden)return;
  const v=WMODE?'mini':S.view;
  if(e.key==='n'||e.key==='N'||e.key==='ㅜ'){e.preventDefault();openNew();return}
  if(e.key==='1'){S.view='cal';render()}else if(e.key==='2'){S.view='list';render()}else if(e.key==='3'){S.view='mini';render()}
  else if(v==='cal'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){calM+=e.key==='ArrowLeft'?-1:1;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render()}
  else if(v==='cal'&&(e.key==='t'||e.key==='T'||e.key==='ㅅ')){const t=pd(today());calY=t.getFullYear();calM=t.getMonth();selDay=today();render()}});
window.__planner={plan,status,S:()=>S};
render();
})();
</script>
