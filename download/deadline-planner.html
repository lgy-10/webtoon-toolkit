<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마감 역산 일정표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 위 일정 탭 → 요약(D-day·상태·진행률) → 타임라인 → 단계 표 → 메모 */
:root{
  --bg:#f5f5f6;--surface:#fff;--ink:#151517;--muted:#6e6e76;--line:#e4e4e8;--dark:#2a2b30;--seg1:#3a3b41;--seg2:#5b5c63;--good:#1f8a55;--warn:#c27a10;--bad:#c8333a;--soft:#eef3fc;--accent:#2f6fd6;--c1:#2f6fd6;--c2:#d0483f;--c3:#1f8a55;--c4:#b0700f;--c5:#7a4bc4;--c6:#0f8a8a;--evtx:#fff;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--surface:#1b1b1e;--ink:#ececf0;--muted:#9a9aa3;--line:#2c2c31;--dark:#2e2f35;--seg1:#4a4b52;--seg2:#63646c;--good:#3fbf7f;--warn:#e0a03a;--bad:#ef6a70;--soft:#1a2436;--accent:#6b9cf0;--c1:#6b9cf0;--c2:#ef7a72;--c3:#4cc98a;--c4:#e3a646;--c5:#a98be8;--c6:#4fc4c4;--evtx:#111113;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;word-break:keep-all;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:8px;padding-block:18px 10px;flex-wrap:wrap}
header.top h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.02em;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:700;white-space:nowrap;transition:transform .12s,background-color .18s,border-color .18s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
@media (hover:hover){.btn:hover{border-color:var(--ink)}.btn.ghost:hover{border-color:transparent;color:var(--ink)}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
.ptab{flex-shrink:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px;font-weight:500;max-width:260px}
.ptab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptab .dd{white-space:nowrap;flex-shrink:0;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.ptab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ptab.on .dd{background:color-mix(in oklab,var(--bg) 18%,transparent);color:inherit}
.dd.urgent{color:var(--bad)!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.head{display:flex;flex-direction:column;gap:12px}
.name{font-size:22px;font-weight:900;letter-spacing:-.02em;border:1px solid transparent;border-radius:8px;padding:4px 6px;margin:-4px -6px;background:transparent;width:100%;min-width:0}
.name:hover{border-color:var(--line)}.name:focus{outline:none;border-color:var(--ink);background:var(--bg)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.dates{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:500;color:var(--ink);min-width:0}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;padding-bottom:9px;cursor:pointer;user-select:none}
.tog input{width:18px;height:18px;accent-color:var(--ink)}
.client{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.client .full{grid-column:1/-1}
.client textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14.5px;font-weight:500;color:var(--ink);min-height:64px;resize:vertical;line-height:1.6}
@media (max-width:560px){.client{grid-template-columns:minmax(0,1fr)}}
.wait{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 7px}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.dday{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.dday small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.stat{display:flex;flex-direction:column;gap:8px;min-width:0}
.pill{align-self:flex-start;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700;color:#fff;background:var(--good)}
.pill.warn{background:var(--warn)}.pill.bad{background:var(--bad)}.pill.idle{background:var(--muted)}
.now{font-size:14px;color:var(--muted)}
.now b{color:var(--ink)}
.prog{height:10px;border-radius:999px;background:var(--bg);overflow:hidden;position:relative;border:1px solid var(--line)}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px;transition:width .5s var(--ease)}
.prog em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--ink)}
.legend span.exp::before{width:2px;background:var(--bad)}
.tl{position:relative;margin-top:30px}
.tlbar{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:2px}
.seg{position:relative;min-width:3px;background:var(--seg1);overflow:hidden;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.seg:nth-child(even){background:var(--seg2)}
.seg.done{background:var(--good)!important}
.seg .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.22)}
.seg span{position:relative;overflow:hidden;text-overflow:ellipsis}
.tlnow{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--bad);border-radius:2px}
.tlnow::after{content:"오늘";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--bad);white-space:nowrap}
.tlax{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.sh{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.sh h2{margin:0;font-size:16px;font-weight:900}
.sh span{font-size:12.5px;color:var(--muted)}
.stages{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:28px minmax(0,1.3fr) 76px minmax(0,1.5fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st.cur{background:linear-gradient(90deg,var(--soft),transparent);border-radius:10px}
.st .no{font-size:13px;font-weight:900;color:var(--muted);text-align:center}
.st.cur .no{color:var(--accent)}
.st input[type=text],.st input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%;min-width:0;font-size:14.5px}
.st input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.st .when{font-size:13.5px;font-variant-numeric:tabular-nums;line-height:1.4}
.st .when small{display:block;color:var(--muted);font-size:12px}
.st .when .late{color:var(--bad);font-weight:700}
.pc{display:flex;align-items:center;gap:8px}
.pc input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
.pc output{font-size:13px;font-variant-numeric:tabular-nums;width:38px;text-align:right;color:var(--muted)}
.ops{display:flex;gap:2px}
.ic{border:0;background:transparent;color:var(--muted);border-radius:7px;width:30px;height:30px;font-size:14px}
.ic:hover{background:var(--bg);color:var(--ink)}
.ic:disabled{opacity:.3;cursor:default}
.ic.del.arm{background:var(--bad);color:#fff;width:auto;padding:0 8px;font-size:12px;font-weight:700}
.donechk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.donechk input{width:17px;height:17px;accent-color:var(--good)}
.st.isdone .no{color:var(--good)}
.addst{margin-top:10px}
.colh{display:grid;grid-template-columns:28px minmax(0,1.3fr) 76px minmax(0,1.5fr) minmax(0,1.2fr) auto;gap:10px;font-size:12px;color:var(--muted);font-weight:700;padding:0 0 6px;border-bottom:1px solid var(--line)}
@media (max-width:720px){
  header.top h1{flex-basis:100%}
  header.top .btn{padding:7px 11px;font-size:13.5px}
  .colh{display:none}
  .st{grid-template-columns:28px minmax(0,1fr) 72px;row-gap:8px}
  .st .when{grid-column:2/-1}
  .st .pc{grid-column:2/-1}
  .st .ops{grid-column:2/-1;justify-content:flex-end}
  .sum{grid-template-columns:minmax(0,1fr)}
  .dday{font-size:38px}
}
textarea.memo{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.7}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 30px}
.foot .grow{flex:1}
.delp{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px}
.delp.arm{color:#fff;background:var(--bad);text-decoration:none;border-radius:7px;font-weight:700}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.sample span{flex:1;min-width:200px}
.newov{position:fixed;inset:0;z-index:20;background:rgba(10,10,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 14px 20px;overflow-y:auto}
.newbox{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;padding:18px;display:flex;flex-direction:column;gap:14px;animation:up .28s var(--ease)}
.newbox h2{margin:0;font-size:17px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.presets .preset:last-child:nth-child(odd){grid-column:1/-1}
.preset{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.preset b{font-size:15px}
.preset span{font-size:12.5px;color:var(--muted);line-height:1.5}
.preset[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.viewseg{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:3px;margin:2px 0 12px}
.viewseg button{border:0;background:transparent;border-radius:8px;padding:6px 18px;font-size:14px;font-weight:700;color:var(--muted)}
.viewseg button.on{background:var(--ink);color:var(--bg)}
.todo{display:flex;flex-direction:column;gap:8px}
.todo-i{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg);text-align:left;width:100%}
.todo-i .cl{width:10px;height:36px;border-radius:5px}
.todo-i b{display:block;font-size:15px}
.todo-i span{font-size:13px;color:var(--muted)}
.todo-i .dd2{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.todo-i .dd2.urgent{color:var(--bad)}
@media (hover:hover){.todo-i:hover{border-color:var(--ink)}}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{margin:0 auto 0 0;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-bottom:10px}
.legend2 button{border:0;background:transparent;padding:2px 0;display:flex;align-items:center;gap:6px;color:var(--ink)}
.legend2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend2 button[aria-pressed="false"]{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .wd{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.cal .wd.sun,.day.sun .dn{color:var(--bad)}.cal .wd.sat,.day.sat .dn{color:var(--accent)}
.day{min-height:104px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;cursor:pointer;position:relative}
.day.out{background:var(--bg)}.day.out .dn{opacity:.4}
.day .dn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.day.today .dn{background:var(--ink);color:var(--bg)!important}
.day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.bars{display:flex;flex-direction:column;gap:2px}
.bars i{height:4px;border-radius:2px;display:block;opacity:.55}
.bars i.s{margin-left:40%}.bars i.e{margin-right:40%}
.chips2{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{font-size:11.5px;line-height:1.35;border-radius:4px;padding:1px 5px;color:var(--evtx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev.fin{font-weight:900}
.ev.dn2{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--muted);padding-left:3px}
.daypanel{margin-top:14px}
.daypanel h3{margin:0 0 10px;font-size:16px}
.dp-i{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-align:left;width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent}
.dp-i:first-of-type{border-top:0}
.dp-i .cl{width:10px;height:10px;border-radius:50%}
.dp-i b{font-size:14.5px}
.dp-i span{font-size:13px;color:var(--muted);display:block}
.dp-i em{font-style:normal;font-size:12.5px;font-weight:700;white-space:nowrap}
.dp-empty{color:var(--muted);font-size:14px}
@media (max-width:640px){
  .day{min-height:64px;padding:3px 2px}
  .day .dn{font-size:12px;width:21px;height:21px}
  .ev{font-size:0;padding:0;height:6px;border-radius:3px}
  .more{display:none}
  .bars i{height:3px}
}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{animation:up .4s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>마감 역산 일정표</h1>
    <button class="btn primary" id="newBtn">+ 새 일정</button>
    <button class="btn" id="bkBtn">백업 받기</button>
    <button class="btn" id="ldBtn">불러오기</button>
    <input type="file" id="ldIn" accept=".json,application/json" hidden>
  </header>
  <div class="viewseg" role="group" aria-label="보기 방식"><button type="button" data-v="cal">달력</button><button type="button" data-v="list">일정별</button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="일정 목록"></div>
  <div id="sample" class="sample" hidden><span>처음 열면 보이는 <b>예시 일정</b>이에요. 둘러본 다음 지우고 내 일정을 만들어 주세요.</span><button class="btn sm" id="sampleDel">예시 지우기</button></div>
  <main id="main"></main>
  <main id="cal" hidden></main>
</div>

<div class="newov" id="newov" hidden role="dialog" aria-modal="true" aria-labelledby="nTitle">
  <div class="newbox">
    <h2 id="nTitle">새 일정 만들기</h2>
    <div class="presets" id="presets"></div>
    <label class="fld">이름<input id="nName" placeholder="예: 졸업작품 웹툰 1화"></label>
    <label class="fld" id="nClientW" hidden>의뢰인<input id="nClient" placeholder="닉네임이나 이름"></label>
    <div class="dates">
      <label class="fld">시작일<input type="date" id="nStart"></label>
      <label class="fld">마감일<input type="date" id="nDue"></label>
    </div>
    <div class="foot" style="margin:0"><span class="grow"></span><button class="btn ghost" id="nCancel">취소</button><button class="btn primary" id="nOk">만들기</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const KEY='deadline-planner-v1';
const PRESETS={
  grad:{label:'졸업작품',desc:'몇 달짜리 웹툰·애니 졸작',stages:[['기획·시나리오',15],['콘티',20],['선화',25],['채색',22],['식자·후보정',10],['여유 기간',8]]},
  work:{label:'과제작',desc:'단편 만화·애니 같은 작품 과제',stages:[['기획',15],['콘티',25],['작화',40],['마무리',12],['여유 기간',8]]},
  task:{label:'과제물',desc:'리포트·기획안·발표 자료',stages:[['자료 조사',30],['초안 작성',35],['수정',20],['제출 준비',8],['여유 기간',7]]},
  comm:{label:'커미션',desc:'의뢰받은 그림·만화 작업',stages:[['문의·자료 확인',8],['러프',15],['러프 컨펌',8],['선화',22],['채색',25],['수정',12],['납품',5],['여유 기간',5]]},
  custom:{label:'직접 만들기',desc:'단계를 내 마음대로',stages:[['1단계',34],['2단계',33],['3단계',33]]}
};
const TYPES={grad:'졸업작품',work:'과제작',task:'과제물',comm:'커미션',custom:'기타'};
const $=s=>document.querySelector(s);

// ---------- 날짜 ----------
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1,12)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const W=['일','월','화','수','목','금','토'];
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+W[d.getDay()]+')'};

let S=null,canSave=true;

function sampleData(){const t=today();

  return {v:1,cur:null,projects:[mk('grad','예시: 졸업작품 웹툰',addD(t,-40),addD(t,95),[100,60,0,0,0,0]),mk('task','예시: 콘텐츠기획 기말 리포트',addD(t,-3),addD(t,11),[70,0,0,0,0]),Object.assign(mk('comm','예시: 캐릭터 일러스트 커미션',addD(t,-6),addD(t,14),[100,100,40,0,0,0,0,0]),{client:'예시 의뢰인',contact:'DM으로 연락',brief:'전신 1인, 배경 없음, 러프 단계에서 한 번 확인받기로 함'})]}}

// ---------- 계산 ----------
function workDays(p){const out=[];const n=diff(p.start,p.due);if(n<0)return out;for(let i=0;i<=n;i++){const s=addD(p.start,i);const wd=pd(s).getDay();if(!p.skipWeekend||(wd!==0&&wd!==6))out.push(s)}if(!out.length&&n>=0)out.push(p.due);return out}
function plan(p){const days=workDays(p);const N=days.length;const tw=p.stages.reduce((a,s)=>a+Math.max(0,+s.w||0),0)||1;
  let cum=0,prevEnd=-1;const rows=p.stages.map((s,i)=>{cum+=Math.max(0,+s.w||0);let end=Math.round(cum/tw*N)-1;if(i===p.stages.length-1)end=N-1;
    let start=prevEnd+1;if(end<start)end=start;if(start>N-1){start=N-1;end=N-1}if(end>N-1)end=N-1;prevEnd=end;
    return {s,start:days[start],end:days[end],si:start,ei:end,n:end-start+1}});
  return {days,N,tw,rows}}
function status(p){const P=plan(p);const t=today();const tw=P.tw;
  const actual=p.stages.reduce((a,s)=>a+Math.max(0,+s.w||0)*(s.done?1:Math.min(100,+s.pct||0)/100),0)/tw;
  let ti=P.days.findIndex(d=>d>t);if(ti<0)ti=P.N;  // 오늘까지 지난 작업일 수
  let expected=0;P.rows.forEach(r=>{const w=Math.max(0,+r.s.w||0);const passed=Math.max(0,Math.min(r.n,ti-r.si));expected+=w*passed/r.n});expected/=tw;
  const lagDays=(expected-actual)*P.N;
  const cur=P.rows.find(r=>t>=r.start&&t<=r.end&&!r.s.done)||P.rows.find(r=>!r.s.done&&r.start>t)||null;
  const left=diff(t,p.due);
  let kind='good',text='계획대로 가고 있어요';
  if(actual>=0.999){kind='good';text='모든 단계를 끝냈어요'}
  else if(t<p.start){kind='idle';text='아직 시작 전이에요'}
  else if(left<0){kind='bad';text='마감일이 지났어요'}
  else if(lagDays>=3){kind='bad';text='계획보다 약 '+Math.round(lagDays)+'일 늦어요'}
  else if(lagDays>=1){kind='warn';text='계획보다 약 '+Math.round(lagDays)+'일 늦어요'}
  else if(lagDays<=-1){kind='good';text='계획보다 약 '+Math.round(-lagDays)+'일 앞서 있어요'}
  return {P,actual,expected,lagDays,cur,left,kind,text}}
const ddText=n=>n>0?'D-'+n:n===0?'D-day':'D+'+(-n);

function cur(){return S.projects.find(p=>p.id===S.cur)||null}

const colorOf=p=>{const i=S.projects.indexOf(p);return 'var(--c'+((p.color!=null?p.color:i)%6+1)+')'};

function allEvents(){const ev=[];S.projects.forEach(p=>{if(hidden.has(p.id))return;const P=plan(p);
  P.rows.forEach(r=>{if(/여유/.test(r.s.name))return;if(r.end===p.due&&r===P.rows[P.rows.length-1])return;ev.push({date:r.end,p,label:r.s.name+' 마감',done:!!r.s.done,fin:false,row:r})});
  ev.push({date:p.due,p,label:'최종 마감',done:p.stages.every(s=>s.done),fin:true})});return ev}

  // 메모
  const mc=el('section','card');const msh=el('div','sh');msh.appendChild(el('h2','','메모'));mc.appendChild(msh);
  const ta=el('textarea','memo');ta.value=p.memo||'';ta.placeholder=p.type==='comm'?'파일 형식, 해상도, 전달 방법, 수정 요청 내용 같은 걸 적어 두세요.':'제출 형식, 교수님 피드백, 준비물 같은 걸 적어 두세요.';ta.setAttribute('aria-label','메모');ta.onchange=()=>{p.memo=ta.value;save()};mc.appendChild(ta);m.appendChild(mc);
  // 아래
  const ft=el('div','foot');const ics=el('button','btn','캘린더 파일(.ics) 받기');ics.onclick=()=>exportIcs(p);
  const cp=el('button','btn ghost','복사해서 새로 만들기');cp.onclick=()=>{const q=JSON.parse(JSON.stringify(p));q.id=uid();q.name=p.name+' (복사)';delete q.sample;q.stages.forEach(s=>{s.id=uid();s.pct=0;s.done=false});S.projects.push(q);S.cur=q.id;render();toast('복사했어요','good')};
  const dp=el('button','delp','이 일정 삭제');arm(dp,'한 번 더 누르면 삭제',()=>{S.projects=S.projects.filter(x=>x!==p);S.cur=S.projects[0]?S.projects[0].id:null;render();toast('일정을 지웠어요')});
  ft.append(ics,cp,el('span','grow'),dp);m.appendChild(ft);
  if(!canSave){const w=el('p','',);w.style.cssText='color:var(--muted);font-size:13px;text-align:center;margin:-10px 0 30px';w.textContent='지금 화면에서는 저장되지 않아요. 파일을 받아서 열면 자동으로 저장돼요.';m.appendChild(w)}
}
function arm(btn,label,fn){const l=btn.textContent;btn.onclick=()=>{if(btn.classList.contains('arm')){btn.classList.remove('arm');btn.textContent=l;fn();return}btn.classList.add('arm');btn.textContent=label;setTimeout(()=>{if(btn.isConnected){btn.classList.remove('arm');btn.textContent=l}},2600)}}

// ---------- 새 일정 ----------
let nType='grad';
function drawPresets(){const b=$('#presets');b.textContent='';Object.entries(PRESETS).forEach(([k,v])=>{const x=el('button','preset');x.type='button';x.setAttribute('aria-pressed',k===nType);x.append(el('b','',v.label),el('span','',v.desc));x.onclick=()=>{nType=k;drawPresets()};b.appendChild(x)});$('#nClientW').hidden=nType!=='comm';$('#nName').placeholder=nType==='comm'?'예: 캐릭터 일러스트 커미션':nType==='task'?'예: 콘텐츠기획 기말 리포트':'예: 졸업작품 웹툰 1화'}
function openNew(){nType='grad';$('#nClient').value='';drawPresets();$('#nName').value='';$('#nStart').value=today();$('#nDue').value=addD(today(),30);$('#newov').hidden=false;setTimeout(()=>$('#nName').focus(),50)}
function closeNew(){$('#newov').hidden=true}
$('#newBtn').onclick=openNew;$('#nCancel').onclick=closeNew;
$('#newov').addEventListener('mousedown',e=>{if(e.target===$('#newov'))closeNew()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#newov').hidden)closeNew()});
$('#nOk').onclick=()=>{const st=$('#nStart').value,du=$('#nDue').value;if(!st||!du){toast('시작일과 마감일을 골라 주세요.','bad');return}if(du<st){toast('마감일은 시작일보다 뒤여야 해요.','bad');return}
  const pr=PRESETS[nType];const p={id:uid(),name:$('#nName').value.trim()||pr.label,type:nType,start:st,due:du,skipWeekend:false,memo:'',stages:pr.stages.map(([n,w])=>({id:uid(),name:n,w,pct:0,done:false}))};const cl=$('#nClient').value.trim();if(nType==='comm'&&cl)p.client=cl;
  S.projects.push(p);S.cur=p.id;S.view='list';closeNew();render();toast('일정을 만들었어요. 단계별 마감이 자동으로 잡혔어요.','good')};
$('#sampleDel').onclick=()=>{S.projects=S.projects.filter(p=>!p.sample);S.cur=S.projects[0]?S.projects[0].id:null;render();toast('예시를 지웠어요')};

// ---------- 파일 ----------
function dl(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
$('#bkBtn').onclick=()=>{dl('마감일정표_백업_'+today()+'.json',new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));toast('백업 파일을 받았어요','good')};
$('#ldBtn').onclick=()=>$('#ldIn').click();
$('#ldIn').onchange=async()=>{const f=$('#ldIn').files[0];$('#ldIn').value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.projects))throw 0;S=d;S.cur=S.projects[0]?S.projects[0].id:null;render();toast('불러왔어요','good')}catch(e){toast('이 파일은 불러올 수 없어요. 백업 받기로 만든 파일인지 확인해 주세요.','bad')}};
function exportIcs(p){const P=plan(p);const esc=t=>String(t).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//deadline-planner//KO','CALSCALE:GREGORIAN'];
  const ev=(id,title,d)=>{lines.push('BEGIN:VEVENT','UID:'+id+'@deadline-planner','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d.replace(/-/g,''),'DTEND;VALUE=DATE:'+addD(d,1).replace(/-/g,''),'SUMMARY:'+esc(title),'END:VEVENT')};
  P.rows.forEach(r=>{if(!/여유/.test(r.s.name))ev(r.s.id,'['+p.name+'] '+r.s.name+' 마감',r.end)});ev(p.id,'['+p.name+'] 최종 마감',p.due);
  lines.push('END:VCALENDAR');dl((p.name||'일정').replace(/[\\/:*?"<>|]/g,'')+'.ics',new Blob([lines.join('\r\n')],{type:'text/calendar'}));toast('캘린더 파일을 받았어요. 구글 캘린더 등에서 가져오기로 넣을 수 있어요.','good')}
window.__planner={plan,status,S:()=>S};
render();
})();
</script>
</body>
</html>
