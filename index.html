</head><body><script>window.__HUB_STATIC__=true</script><script id="hub-data" type="application/json">{"site": {"name": "웹툰 작가를 위한 작업 도구", "kick": "FREE TOOLS FOR WEBTOON ARTISTS", "h1": "글콘티부터 포트폴리오까지,\n파일 하나로 바로 써요.", "lead": "", "badges": ["무료", "가입 없이 사용", "설치 없이도 사용", "파일로 백업"], "foot1": "", "foot2": "", "siteUrl": "https://lgy-10.github.io/webtoon-toolkit"}, "tools": [{"id": "conti", "kick": "CONTI WORKBENCH", "name": "글콘티 작업대", "lead": "컷마다 상황과 대사를 나눠 적는 글콘티 전용 편집기예요. 50컷 넘는 회차도 깔끔하게 정리돼요.", "points": ["상황은 왼쪽, 대사는 오른쪽에 적고 컷 크기·태그·장소를 구분해요", "10컷을 한꺼번에 추가하고, 컷 순서를 바꾸고, 검색할 수 있어요", "자동으로 저장되고, 되돌리기·다시 하기도 돼요", "PDF·TXT로 내보내고, JSON으로 백업하고 불러와요"], "img": "img/conti-desktop.jpg", "alt": "글콘티 작업대 화면: 컷마다 상황과 대사를 나눠 적는 편집기", "phone": "", "phoneAlt": "", "href": "", "file": "download/conti-workbench.html", "fileName": "글콘티_작업대.html", "post": "conti", "preview": "conti/index.html"}, {"id": "portfolio", "kick": "PORTFOLIO TEMPLATE", "name": "포트폴리오 틀", "lead": "콘티·웹툰·출판 만화를 작품별로 올리고, 그대로 내 사이트로 내보내는 포트폴리오예요. 예시 작품이 들어 있어서 열자마자 모양을 볼 수 있어요.", "points": ["웹툰은 세로 스크롤, 출판 만화는 페이지 넘김으로 보여 줘요", "캐릭터 시트와 기획안을 문서 형식으로 정리해요", "작가 소개, 이력, 작업 분야·툴을 적고 대표작을 고정해요", "사이트 파일(zip)로 내보내서 무료 호스팅에 바로 올려요"], "img": "img/portfolio-desktop.jpg", "alt": "포트폴리오 틀 화면: 대표작 카드와 작품 목록, 작가 소개", "phone": "img/portfolio-comic-mobile.jpg", "phoneAlt": "폰에서 출판 만화를 페이지로 넘겨 보는 화면", "href": "", "file": "download/portfolio-template.html", "fileName": "포트폴리오_틀.html", "post": "portfolio", "preview": "portfolio/index.html"}, {"id": "planner", "kick": "DEADLINE PLANNER", "name": "마감 역산 일정표", "lead": "마감일만 넣으면 단계별 마감을 거꾸로 계산해 주는 일정표예요. 졸업작품, 과제작, 과제물, 커미션을 한곳에서 관리해요.", "points": ["달력 한 장에 모든 일정의 단계별 마감이 보여요", "졸업작품·과제작·과제물·커미션 단계가 미리 들어 있어요", "색상 테마 6가지, D-day를 크게 보여주는 위젯", "PC 위젯 프로그램(윈도우·맥)이나 캘린더 파일(.ics)로도 써요"], "img": "img/planner-desktop.jpg", "alt": "마감 역산 일정표 화면: 오늘 할 일과 월간 달력", "phone": "img/planner-mobile.jpg", "phoneAlt": "폰에서 본 마감 역산 일정표", "href": "", "file": "download/deadline-planner.html", "fileName": "마감_역산_일정표.html", "post": "planner", "preview": "planner/index.html", "app": "planner/"}, {"id": "scroll", "kick": "SCROLL LAB", "name": "스크롤 랩", "lead": "원고 이미지나 PDF를 넣으면 폰 화면에서 독자가 보는 그대로 스크롤해 보는 미리보기 도구예요. 컷 사이 간격과 연출 템포를 올리기 전에 확인해요.", "points": ["이미지 여러 장이나 PDF를 넣으면 하나의 긴 원고로 이어져요", "컷 순서 바꾸기, 컷마다 간격 따로 정하기", "폰 화면 너비 4가지와 자동 스크롤 속도 조절", "작업은 브라우저에 자동 저장, 프로젝트 파일로 백업"], "img": "img/scroll-desktop.jpg", "alt": "스크롤 랩 화면: 왼쪽 컷 목록, 가운데 폰 미리보기, 오른쪽 설정", "phone": "img/scroll-mobile.jpg", "phoneAlt": "폰에서 본 스크롤 랩", "href": "", "file": "download/scroll-lab.html", "fileName": "스크롤_랩.html", "post": "scroll", "preview": "scroll/index.html"}], "posts": [{"id": "conti", "tag": "글콘티 작업대", "title": "글콘티 작업대, 5분 만에 시작하기", "sum": "컷 추가부터 PDF 내보내기, 백업까지 한 번에 정리했어요.", "date": "2026.11.10", "html": "\u003cp>글콘티 작업대는 컷 단위로 상황과 대사를 나눠 적는 편집기예요. 회원가입 없이 바로 쓸 수 있어요.\u003c/p>\n\u003ch2>1. 열기\u003c/h2>\n\u003col>\u003cli>위의 \u003cb>파일 받기\u003c/b>로 받은 HTML 파일을 더블클릭하면 빈 작업대가 열려요.\u003c/li>\u003cli>왼쪽 위 \u003cb>새 작품\u003c/b>을 눌러 작품 제목을 바꿔요.\u003c/li>\u003c/ol>\n\u003ch2>2. 컷 쓰기\u003c/h2>\n\u003col>\u003cli>컷마다 왼쪽 \u003cb>상황\u003c/b> 칸에 장면(누가, 어디서, 무엇을, 구도)을 적어요.\u003c/li>\u003cli>오른쪽 \u003cb>대사\u003c/b> 칸에 화자와 대사를 적어요. \u003cb>+ 대사\u003c/b>로 줄을 늘릴 수 있어요.\u003c/li>\u003cli>컷 크기(소형·중형·대형)와 태그(사물·손·배경 등)로 연출 메모를 남겨요.\u003c/li>\u003cli>\u003cb>+ 10컷\u003c/b>으로 빈 컷을 한꺼번에 만들고, \u003cb>+ 장소 구분\u003c/b>으로 장면이 바뀌는 지점을 표시해요.\u003c/li>\u003c/ol>\n\u003ch2>3. 회차 나누기\u003c/h2>\n\u003cp>위쪽 \u003cb>+ 새 화\u003c/b>로 회차를 추가해요. 화 제목(예: 1화)은 눌러서 바로 고칠 수 있고, 화 버튼 메뉴에서 삭제할 수 있어요.\u003c/p>\n\u003ch2>4. 저장하고 백업하기\u003c/h2>\n\u003cul>\u003cli>쓰는 동안 자동으로 저장돼요. 잘못 지웠으면 ↶ 버튼으로 되돌려요.\u003c/li>\u003cli>\u003cb>JSON 백업\u003c/b>을 받아 두면 다른 기기에서 \u003cb>불러오기\u003c/b>로 이어서 쓸 수 있어요.\u003c/li>\u003cli>\u003cb>PDF로 저장\u003c/b>, \u003cb>TXT로 저장\u003c/b>으로 제출용 파일을 만들 수 있어요.\u003c/li>\u003c/ul>\n\u003cdiv class=\"note\">작업 내용은 지금 쓰는 브라우저에만 저장돼요. 큰 작업은 중간중간 JSON 백업을 받아 두세요.\u003c/div>"}, {"id": "portfolio", "tag": "포트폴리오 틀", "title": "포트폴리오 틀로 내 작품 올리기", "sum": "예시 작품 둘러보기부터 콘티·시트·기획안 올리기까지 정리했어요.", "date": "2026.11.10", "html": "\u003cp>포트폴리오 틀은 작품별로 콘티, 캐릭터 시트, 기획안을 정리하는 내 포트폴리오예요. 처음 열면 예시 작품 2개가 들어 있어요.\u003c/p>\n\u003ch2>1. 예시 둘러보기\u003c/h2>\n\u003cp>위의 \u003cb>파일 받기\u003c/b>로 받은 HTML 파일을 더블클릭해서 열어요. ‘예시 웹툰’은 세로 스크롤, ‘예시 단편’은 출판 만화처럼 페이지를 넘겨 보는 작품이에요. 다 봤으면 위쪽 파란 안내의 \u003cb>예시 모두 지우기\u003c/b>를 눌러요.\u003c/p>\n\u003ch2>2. 프로필 채우기\u003c/h2>\n\u003cp>\u003cb>프로필 수정\u003c/b>에서 사이트 이름, 프로필 사진, 이름·소속, 작업 분야, 사용 툴, 이력, 이메일과 링크를 적어요. 비워 둔 칸은 화면에 안 나와요.\u003c/p>\n\u003ch2>3. 작품 올리기\u003c/h2>\n\u003col>\u003cli>\u003cb>작품 관리 → + 새 작품 만들기\u003c/b>를 눌러요.\u003c/li>\u003cli>\u003cb>작품 정보\u003c/b>에서 제목, 분류, 장르, 소개를 적고, 보는 방식(세로 스크롤 / 페이지 넘김)을 골라요.\u003c/li>\u003cli>\u003cb>회차\u003c/b> 탭에서 \u003cb>+ 새 화 추가\u003c/b>를 누르고 콘티 이미지나 PDF를 올려요. 화면에 파일을 끌어다 놓아도 돼요.\u003c/li>\u003cli>캐릭터 시트와 기획안은 작품 화면의 각 탭에서 \u003cb>수정하기\u003c/b>를 눌러 문서처럼 채워요.\u003c/li>\u003c/ol>\n\u003ch2>4. 남들이 보는 화면 확인하기\u003c/h2>\n\u003cp>서재 위 \u003cb>방문자 화면\u003c/b>을 누르면 관리 버튼이 숨겨진 실제 모습을 볼 수 있어요.\u003c/p>\n\u003cdiv class=\"note\">작품과 이미지는 이 브라우저에만 저장돼요. \u003cb>작품 관리\u003c/b> 맨 아래 \u003cb>백업 파일 받기\u003c/b>로 꼭 백업해 두세요.\u003c/div>"}, {"id": "planner", "tag": "마감 역산 일정표", "title": "졸작·과제·커미션 마감, 거꾸로 계산해서 지키기", "sum": "마감일만 넣으면 단계별 마감이 잡히고, 달력 한 장에 모든 일정이 보여요.", "date": "2026.11.13", "html": "\u003cp>마감 역산 일정표는 최종 마감일에서 거꾸로 계산해서 단계별 마감을 잡아 주는 도구예요. 졸업작품처럼 몇 달짜리 작업도, 2주짜리 리포트도 같은 방식으로 관리할 수 있어요.\u003c/p>\n\u003ch2>1. 일정 만들기\u003c/h2>\n\u003col>\u003cli>\u003cb>+ 새 일정\u003c/b>을 누르고 종류를 골라요. \u003cb>졸업작품\u003c/b>, \u003cb>과제작\u003c/b>, \u003cb>과제물\u003c/b>, \u003cb>커미션\u003c/b>, \u003cb>직접 만들기\u003c/b>가 있어요.\u003c/li>\u003cli>이름, 시작일, 마감일을 넣고 \u003cb>만들기\u003c/b>를 눌러요.\u003c/li>\u003cli>종류에 맞는 단계(예: 기획 → 콘티 → 선화 → 채색 → 식자·후보정)가 자동으로 들어가고, 단계별 마감 날짜가 잡혀요.\u003c/li>\u003c/ol>\n\u003ch2>2. 단계 다듬기\u003c/h2>\n\u003cul>\u003cli>\u003cb>비중\u003c/b>은 그 단계에 시간을 얼마나 쓸지예요. 숫자가 클수록 기간이 길어지고, 바꾸면 날짜가 바로 다시 계산돼요.\u003c/li>\u003cli>단계 이름을 고치거나, \u003cb>+ 단계 추가\u003c/b>로 늘리거나, ↑ ↓로 순서를 바꿀 수 있어요.\u003c/li>\u003cli>주말에 작업하지 않으면 \u003cb>주말은 쉬어요\u003c/b>를 켜요. 주말을 빼고 다시 계산해요.\u003c/li>\u003c/ul>\n\u003cdiv class=\"note\">마지막의 \u003cb>여유 기간\u003c/b>은 지우지 않는 걸 추천해요. 수정 요청이나 컨디션 난조처럼 예상 못 한 일이 생겼을 때 버팀목이 돼요.\u003c/div>\n\u003ch2>3. 진행 상황 적기\u003c/h2>\n\u003cp>단계마다 진행률을 움직이거나 \u003cb>완료\u003c/b>에 체크해요. 위쪽에 \u003cb>지금 할 단계\u003c/b>와 함께 ‘계획대로 가고 있어요’, ‘계획보다 약 4일 늦어요’ 같은 상태가 떠요. 진행 막대의 빨간 선은 오늘까지 끝냈어야 하는 양이에요.\u003c/p>\n\u003ch2>커미션으로 쓸 때\u003c/h2>\n\u003cul>\u003cli>\u003cb>커미션\u003c/b>을 고르면 문의·자료 확인 → 러프 → 러프 컨펌 → 선화 → 채색 → 수정 → 납품 단계가 들어가요.\u003c/li>\u003cli>\u003cb>의뢰인\u003c/b>, \u003cb>연락 메모\u003c/b>, \u003cb>의뢰 내용\u003c/b> 칸에 누구의 어떤 의뢰인지 적어 둘 수 있어요. 일정 탭에도 의뢰인 이름이 같이 보여요.\u003c/li>\u003cli>‘컨펌’처럼 상대 확인이 필요한 단계에 오면 \u003cb>상대 확인 기다리는 단계\u003c/b> 표시가 떠요.\u003c/li>\u003c/ul>\n\u003cdiv class=\"note\">금액, 입금, 계약 관리는 들어 있지 않아요. 필요한 내용은 메모 칸에 직접 적어 두세요.\u003c/div>\n\u003ch2>달력으로 한눈에 보기\u003c/h2>\n\u003cp>처음 열면 \u003cb>달력\u003c/b> 화면이에요. 맨 위 \u003cb>오늘 할 일\u003c/b>에 일정마다 지금 할 단계와 남은 날이 정리돼 있고, 아래 달력에는 일정별 색깔로 단계 마감과 최종 마감이 표시돼요. 날짜 아래 얇은 선은 그 일정이 진행 중인 기간이에요.\u003c/p>\n\u003cul>\u003cli>날짜를 누르면 그날 마감과 진행 중인 단계가 아래에 정리돼요. 항목을 누르면 그 일정으로 들어가요.\u003c/li>\u003cli>달력 위 색깔 이름을 누르면 그 일정을 달력에서 잠깐 숨길 수 있어요.\u003c/li>\u003cli>단계를 고치거나 진행률을 적을 때는 \u003cb>일정별\u003c/b>로 바꿔요.\u003c/li>\u003c/ul>\n\u003ch2>색상 바꾸기\u003c/h2>\n\u003cp>오른쪽 위 \u003cb>색상\u003c/b>에서 기본, 노을빛, 바다, 빈티지, 팝, 파스텔 중에 고를 수 있어요. 버튼 색과 일정별 색이 함께 바뀌어요.\u003c/p>\n\u003ch2>앱으로 설치하고 위젯처럼 쓰기\u003c/h2>\n\u003col>\u003cli>도구 카드의 \u003cb>앱으로 열기\u003c/b>를 눌러 일정표를 열어요.\u003c/li>\u003cli>PC 크롬·엣지는 주소창 오른쪽의 설치 아이콘, 안드로이드 크롬은 메뉴(⋮)의 \u003cb>앱 설치\u003c/b> 또는 \u003cb>홈 화면에 추가\u003c/b>를 눌러요. 화면 위에 \u003cb>앱으로 설치\u003c/b> 버튼이 뜨면 그걸 눌러도 돼요.\u003c/li>\u003cli>설치하면 바탕화면이나 홈 화면 아이콘으로 바로 열려요. 인터넷이 없어도 열려요.\u003c/li>\u003cli>위쪽 \u003cb>위젯\u003c/b>을 누르면 가장 급한 일정의 D-day가 크게 보이는 작은 화면이 돼요. PC에서는 창을 작게 줄여 옆에 띄워 두면 위젯처럼 쓸 수 있어요. 앱 아이콘을 길게 누르면 나오는 \u003cb>위젯 모드\u003c/b>로 바로 열 수도 있어요.\u003c/li>\u003c/ol>\n\u003cdiv class=\"note\">설치한 앱과 받은 파일은 저장 공간이 따로예요. 옮기고 싶으면 한쪽에서 \u003cb>백업 받기\u003c/b>, 다른 쪽에서 \u003cb>불러오기\u003c/b>를 해 주세요. 휴대폰 홈 화면에 붙는 진짜 위젯은 웹으로는 만들 수 없어서, 작은 창으로 띄우는 방식이에요. PC는 아래 위젯 프로그램을 쓰면 돼요.\u003c/div>\n\u003ch2>PC 위젯 프로그램 (선택)\u003c/h2>\n\u003cp>일정표는 설치 없이 브라우저에서 다 쓸 수 있어요. 바탕화면에 D-day를 늘 띄워 두고 싶을 때만 받으면 돼요.\u003c/p>\n\u003col>\u003cli>오른쪽 위 \u003cb>↓ 프로그램 받기\u003c/b>에서 내 컴퓨터에 맞는 파일을 받아요. 윈도우, 맥(M1~M4 칩), 맥(인텔) 세 가지예요.\u003c/li>\u003cli>압축을 풀고 실행해요. 개인이 만든 프로그램이라 처음 한 번 보안 경고가 떠요.\u003cbr>윈도우: 파란 창에서 \u003cb>추가 정보 → 실행\u003c/b>\u003cbr>맥: 앱을 \u003cb>응용 프로그램\u003c/b> 폴더로 옮긴 뒤 실행하고, \u003cb>시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기\u003c/b>\u003c/li>\u003cli>전체 창과 함께 D-day 위젯이 떠요. 핀 버튼을 켜면 다른 창보다 늘 위에 있어요.\u003c/li>\u003cli>컴퓨터를 켜면 위젯이 알아서 떠요. 트레이(맥은 위쪽 메뉴 막대) 아이콘 메뉴에서 끌 수 있어요.\u003c/li>\u003c/ol>\n\u003cdiv class=\"note\">프로그램의 일정은 웹사이트와 따로 저장돼요. 옮길 땐 \u003cb>백업 받기\u003c/b> → \u003cb>불러오기\u003c/b>를 써 주세요. 자세한 설명은 압축 파일 안 README.txt에 있어요.\u003c/div>\n\u003ch2>알아 두면 편한 기능\u003c/h2>\n\u003cul>\u003cli>고친 내용은 바로 자동 저장되고, 제목 아래에 마지막 저장 시각이 보여요.\u003c/li>\u003cli>일정이나 단계를 지웠으면 아래에 뜨는 \u003cb>되돌리기\u003c/b>로 바로 살릴 수 있어요.\u003c/li>\u003cli>마지막 백업이 일주일 넘으면 위쪽에 백업 알림이 떠요.\u003c/li>\u003cli>달력에서 날짜를 누르고 \u003cb>+ 이날 마감으로 새 일정\u003c/b>을 누르면 그 날짜가 마감일로 들어간 채로 시작해요.\u003c/li>\u003cli>다 끝낸 일정은 일정 탭 끝에 접혀서, 진행 중인 것만 보여요.\u003c/li>\u003cli>PC에서는 단축키를 쓸 수 있어요. \u003ccode>N\u003c/code> 새 일정, \u003ccode>←\u003c/code> \u003ccode>→\u003c/code> 달 넘기기, \u003ccode>T\u003c/code> 오늘, \u003ccode>1\u003c/code> \u003ccode>2\u003c/code> \u003ccode>3\u003c/code> 보기 바꾸기.\u003c/li>\u003c/ul>\n\u003ch2>4. 캘린더에 넣기\u003c/h2>\n\u003cp>\u003cb>캘린더 파일(.ics) 받기\u003c/b>를 누르면 단계별 마감과 최종 마감이 담긴 파일이 받아져요. 구글 캘린더나 폰 캘린더의 \u003cb>가져오기\u003c/b>로 넣으면 알림을 받을 수 있어요.\u003c/p>\n\u003cdiv class=\"note\">일정은 지금 쓰는 브라우저에만 저장돼요. 가끔 \u003cb>백업 받기\u003c/b>로 파일을 받아 두고, 다른 기기에서는 \u003cb>불러오기\u003c/b>로 이어서 쓰세요.\u003c/div>"}, {"id": "scroll", "tag": "스크롤 랩", "title": "올리기 전에 폰 화면으로 원고 템포 확인하기", "sum": "이미지나 PDF를 넣고, 간격을 조절하고, 독자 속도로 스크롤해 봐요.", "date": "2026.11.13", "html": "\u003cp>스크롤 랩은 웹툰 원고를 폰 화면 크기 그대로 이어 붙여서, 독자가 내려 보는 속도로 확인하는 도구예요. 작업 프로그램에서는 잘 안 보이는 컷 사이 간격이나 연출 템포를 미리 볼 수 있어요.\u003c/p>\n\u003ch2>1. 원고 넣기\u003c/h2>\n\u003col>\u003cli>왼쪽 칸을 누르거나 이미지를 끌어다 놓아요. JPG, PNG, WEBP, GIF 이미지와 \u003cb>PDF\u003c/b>를 넣을 수 있어요.\u003c/li>\u003cli>PDF는 쪽마다 컷 하나로 바뀌어요. 컷은 120개까지 넣을 수 있어요.\u003c/li>\u003cli>처음이라면 \u003cb>샘플 체험\u003c/b>으로 예시 컷 5개를 먼저 둘러봐도 돼요.\u003c/li>\u003c/ol>\n\u003ch2>2. 순서와 간격 맞추기\u003c/h2>\n\u003cul>\u003cli>컷 목록에서 끌어다 놓거나 ↑ ↓로 순서를 바꿔요.\u003c/li>\u003cli>오른쪽 \u003cb>기본 컷 간격\u003c/b>으로 전체 간격을 정하고, 컷을 골라 \u003cb>이 컷 다음의 간격\u003c/b>만 따로 바꿀 수도 있어요. 장면이 바뀌는 곳만 길게 띄울 때 좋아요.\u003c/li>\u003c/ul>\n\u003ch2>3. 독자처럼 보기\u003c/h2>\n\u003cul>\u003cli>\u003cb>화면 너비\u003c/b>를 320~430px 중에 골라 작은 폰과 큰 폰에서 어떻게 보이는지 확인해요.\u003c/li>\u003cli>▶ 버튼을 누르면 정한 속도로 자동 스크롤돼요. PC에서는 \u003ccode>Space\u003c/code> 재생·멈춤, \u003ccode>R\u003c/code> 처음으로.\u003c/li>\u003cli>\u003cb>작업 요약\u003c/b>에서 전체 스크롤 길이를 볼 수 있어요.\u003c/li>\u003c/ul>\n\u003cdiv class=\"note\">작업은 이 브라우저에 자동으로 저장돼요. 다른 기기로 옮기거나 백업하려면 \u003cb>프로젝트 저장\u003c/b>을 눌러 주세요. 이미지가 함께 들어가서 파일이 클 수 있어요. PDF를 넣을 때는 인터넷 연결이 필요해요.\u003c/div>"}, {"id": "github-pages", "tag": "포트폴리오 틀", "title": "내 포트폴리오를 무료 사이트로 올리기 (GitHub Pages)", "sum": "파일을 끌어다 놓으면 나만의 주소가 생겨요. 다시 올려도 무료예요.", "date": "2026.11.11", "html": "\u003cp>포트폴리오 틀에서 만든 작업을 GitHub Pages에 올려서 나만의 주소로 공개하는 방법이에요. 무료이고, 몇 번을 다시 올려도 돈이 들지 않아요. 파일을 끌어다 놓아야 해서 PC에서 하는 게 편해요.\u003c/p>\n\u003ch2>1. 사이트 파일 받기\u003c/h2>\n\u003cp>포트폴리오 틀 서재 위의 \u003cb>사이트 파일(zip)\u003c/b>을 눌러 zip 파일을 받고, 압축을 풀어 둬요. 예시 작품을 지우지 않았다면 먼저 지워 주세요.\u003c/p>\n\u003ch2>2. 저장소 만들기\u003c/h2>\n\u003col>\u003cli>\u003ccode>github.com\u003c/code>에서 회원가입을 해요. 아이디가 사이트 주소에 들어가니까 필명처럼 오래 쓸 이름으로 정해요.\u003c/li>\u003cli>오른쪽 위 \u003cb>+ → New repository\u003c/b>를 눌러요.\u003c/li>\u003cli>저장소 이름을 적어요. 예를 들어 \u003ccode>portfolio\u003c/code>로 하면 주소가 \u003ccode>아이디.github.io/portfolio\u003c/code>가 돼요.\u003c/li>\u003cli>\u003cb>Public\u003c/b>을 고르고 \u003cb>Create repository\u003c/b>를 눌러요.\u003c/li>\u003c/ol>\n\u003cdiv class=\"note\">저장소 이름을 \u003ccode>아이디.github.io\u003c/code>로 정하면 주소가 뒷부분 없이 \u003ccode>아이디.github.io\u003c/code>가 돼요. 이름 끝에 \u003ccode>.github.io\u003c/code>를 붙이는 건 이 경우에만 해요.\u003c/div>\n\u003ch2>3. 파일 올리기\u003c/h2>\n\u003col>\u003cli>만든 저장소 화면에서 \u003cb>uploading an existing file\u003c/b>(또는 \u003cb>Add file → Upload files\u003c/b>)을 눌러요.\u003c/li>\u003cli>압축을 푼 폴더 \u003cb>안의 파일과 폴더\u003c/b>(index.html, images 폴더 등)를 전부 끌어다 놓아요. 폴더째 넣으면 주소가 한 단계 더 깊어지니 안쪽 내용만 넣어요.\u003c/li>\u003cli>아래 \u003cb>Commit changes\u003c/b>를 눌러요.\u003c/li>\u003c/ol>\n\u003ch2>4. 사이트 공개 켜기\u003c/h2>\n\u003col>\u003cli>저장소 위쪽 \u003cb>Settings\u003c/b> → 왼쪽 메뉴 \u003cb>Pages\u003c/b>로 들어가요.\u003c/li>\u003cli>Source는 \u003cb>Deploy from a branch\u003c/b>, Branch는 \u003cb>main\u003c/b>과 \u003cb>/(root)\u003c/b>를 고르고 \u003cb>Save\u003c/b>를 눌러요.\u003c/li>\u003cli>1~2분 뒤 새로고침하면 위쪽에 \u003cb>Your site is live at …\u003c/b>과 주소가 떠요.\u003c/li>\u003c/ol>\n\u003cdiv class=\"note\">브라우저 번역을 켜 두면 메뉴가 ‘설정’, ‘페이지’, ‘브랜치에서 배포’, ‘저장’처럼 한국어로 보여요.\u003c/div>\n\u003ch2>5. 고친 뒤 업데이트하기\u003c/h2>\n\u003cp>포트폴리오 틀에서 고친 다음 zip을 다시 받아 압축을 풀고, 저장소의 \u003cb>Add file → Upload files\u003c/b>에 같은 방식으로 끌어다 놓아요. 같은 이름의 파일은 새 파일로 바뀌고, 1~2분 뒤 사이트에 반영돼요.\u003c/p>\n\u003cdiv class=\"note\">무료 계정은 저장소를 \u003cb>Public\u003c/b>으로 둬야 사이트가 열려요. 저장소를 비공개로 바꾸면 사이트가 내려가고, 다시 공개로 돌려도 Pages를 한 번 더 켜야 해요. 프로필 수정의 ‘사이트 주소’ 칸에 내 주소를 적어 두면 카톡 등으로 공유할 때 미리보기 이미지가 떠요.\u003c/div>"}], "faq": [{"q": "작업한 내용은 어디에 저장돼요?", "a": "지금 쓰고 있는 브라우저 안에만 저장돼요. 서버로 보내지 않아서 다른 사람은 볼 수 없어요. 대신 브라우저 기록을 지우거나 다른 기기로 옮기면 사라지니까, 백업 파일을 꼭 받아 두세요."}, {"q": "다른 기기에서 이어서 할 수 있어요?", "a": "자동 동기화는 없어요. 글콘티 작업대는 JSON 백업, 포트폴리오 틀은 백업 파일, 마감 역산 일정표는 백업 받기, 스크롤 랩은 프로젝트 저장으로 파일을 받아서 다른 기기에서 불러오면 돼요."}, {"q": "받기 전에 먼저 써 볼 수 있어요?", "a": "도구 카드의 미리보기를 누르면 이 사이트에서 바로 열어 볼 수 있어요. PC 화면과 폰 화면으로 바꿔 가며 볼 수 있어요. 미리보기에서 쓴 내용은 저장되지 않으니, 실제 작업은 파일을 받아서 해 주세요."}, {"q": "받은 파일은 어떻게 열어요?", "a": "PC에서는 HTML 파일을 더블클릭하면 크롬이나 엣지 같은 브라우저에서 바로 열려요. 따로 설치할 건 없어요. 작업 내용은 그 브라우저에 저장되니까, 파일을 열 때는 늘 같은 브라우저로 열어 주세요."}, {"q": "폰에서는 어떻게 써요?", "a": "안드로이드(갤럭시 등)\n1. 폰 브라우저로 이 사이트에 들어와서 파일 받기를 눌러요.\n2. ‘내 파일’ 앱 → 다운로드 폴더에서 받은 HTML 파일을 눌러요.\n3. 열 앱을 고르라고 하면 크롬이나 삼성 인터넷을 골라요.\n\n아이폰\n파일 앱의 미리보기로 열면 버튼이 제대로 움직이지 않을 수 있어요. 아이폰에서는 PC에서 작업하는 걸 추천해요.\n\n폰에서도 작업 내용은 그 브라우저에 저장돼요. 파일을 옮기거나 이름을 바꾸면 저장된 내용이 안 보일 수 있으니, 백업 파일을 자주 받아 두세요."}, {"q": "인터넷이 없어도 돼요?", "a": "글쓰기와 저장은 돼요. 다만 글꼴, PDF 불러오기, 사이트 파일(zip) 만들기는 외부 라이브러리를 쓰기 때문에 인터넷 연결이 필요해요."}]}</script>

   "tag": "글콘티 작업대",
   "title": "글콘티 작업대, 5분 만에 시작하기",
   "sum": "컷 추가부터 PDF 내보내기, 백업까지 한 번에 정리했어요.",
   "date": "2026.11.10",
   "html": "<p>글콘티 작업대는 컷 단위로 상황과 대사를 나눠 적는 편집기예요. 회원가입 없이 바로 쓸 수 있어요.<\/p>\n<h2>1. 열기<\/h2>\n<ol><li>위의 <b>파일 받기<\/b>로 받은 HTML 파일을 더블클릭하면 빈 작업대가 열려요.<\/li><li>왼쪽 위 <b>새 작품<\/b>을 눌러 작품 제목을 바꿔요.<\/li><\/ol>\n<h2>2. 컷 쓰기<\/h2>\n<ol><li>컷마다 왼쪽 <b>상황<\/b> 칸에 장면(누가, 어디서, 무엇을, 구도)을 적어요.<\/li><li>오른쪽 <b>대사<\/b> 칸에 화자와 대사를 적어요. <b>+ 대사<\/b>로 줄을 늘릴 수 있어요.<\/li><li>컷 크기(소형·중형·대형)와 태그(사물·손·배경 등)로 연출 메모를 남겨요.<\/li><li><b>+ 10컷<\/b>으로 빈 컷을 한꺼번에 만들고, <b>+ 장소 구분<\/b>으로 장면이 바뀌는 지점을 표시해요.<\/li><\/ol>\n<h2>3. 회차 나누기<\/h2>\n<p>위쪽 <b>+ 새 화<\/b>로 회차를 추가해요. 화 제목(예: 1화)은 눌러서 바로 고칠 수 있고, 화 버튼 메뉴에서 삭제할 수 있어요.<\/p>\n<h2>4. 저장하고 백업하기<\/h2>\n<ul><li>쓰는 동안 자동으로 저장돼요. 잘못 지웠으면 ↶ 버튼으로 되돌려요.<\/li><li><b>JSON 백업<\/b>을 받아 두면 다른 기기에서 <b>불러오기<\/b>로 이어서 쓸 수 있어요.<\/li><li><b>PDF로 저장<\/b>, <b>TXT로 저장<\/b>으로 제출용 파일을 만들 수 있어요.<\/li><\/ul>\n<div class=\"note\">작업 내용은 지금 쓰는 브라우저에만 저장돼요. 큰 작업은 중간중간 JSON 백업을 받아 두세요.<\/div>"
  },
  {

   "tag": "포트폴리오 틀",
   "title": "포트폴리오 틀로 내 작품 올리기",
   "sum": "예시 작품 둘러보기부터 콘티·시트·기획안 올리기까지 정리했어요.",
   "date": "2026.11.10",
   "html": "<p>포트폴리오 틀은 작품별로 콘티, 캐릭터 시트, 기획안을 정리하는 내 포트폴리오예요. 처음 열면 예시 작품 2개가 들어 있어요.<\/p>\n<h2>1. 예시 둘러보기<\/h2>\n<p>위의 <b>파일 받기<\/b>로 받은 HTML 파일을 더블클릭해서 열어요. ‘예시 웹툰’은 세로 스크롤, ‘예시 단편’은 출판 만화처럼 페이지를 넘겨 보는 작품이에요. 다 봤으면 위쪽 파란 안내의 <b>예시 모두 지우기<\/b>를 눌러요.<\/p>\n<h2>2. 프로필 채우기<\/h2>\n<p><b>프로필 수정<\/b>에서 사이트 이름, 프로필 사진, 이름·소속, 작업 분야, 사용 툴, 이력, 이메일과 링크를 적어요. 비워 둔 칸은 화면에 안 나와요.<\/p>\n<h2>3. 작품 올리기<\/h2>\n<ol><li><b>작품 관리 → + 새 작품 만들기<\/b>를 눌러요.<\/li><li><b>작품 정보<\/b>에서 제목, 분류, 장르, 소개를 적고, 보는 방식(세로 스크롤 / 페이지 넘김)을 골라요.<\/li><li><b>회차<\/b> 탭에서 <b>+ 새 화 추가<\/b>를 누르고 콘티 이미지나 PDF를 올려요. 화면에 파일을 끌어다 놓아도 돼요.<\/li><li>캐릭터 시트와 기획안은 작품 화면의 각 탭에서 <b>수정하기<\/b>를 눌러 문서처럼 채워요.<\/li><\/ol>\n<h2>4. 남들이 보는 화면 확인하기<\/h2>\n<p>서재 위 <b>방문자 화면<\/b>을 누르면 관리 버튼이 숨겨진 실제 모습을 볼 수 있어요.<\/p>\n<div class=\"note\">작품과 이미지는 이 브라우저에만 저장돼요. <b>작품 관리<\/b> 맨 아래 <b>백업 파일 받기<\/b>로 꼭 백업해 두세요.<\/div>"
  },
  {
   "id": "planner",
   "tag": "마감 역산 일정표",
   "title": "졸작·과제·커미션 마감, 거꾸로 계산해서 지키기",
   "sum": "마감일만 넣으면 단계별 마감이 잡히고, 달력 한 장에 모든 일정이 보여요.",
   "date": "2026.11.13",
   "html": "<p>마감 역산 일정표는 최종 마감일에서 거꾸로 계산해서 단계별 마감을 잡아 주는 도구예요. 졸업작품처럼 몇 달짜리 작업도, 2주짜리 리포트도 같은 방식으로 관리할 수 있어요.<\/p>\n<h2>1. 일정 만들기<\/h2>\n<ol><li><b>+ 새 일정<\/b>을 누르고 종류를 골라요. <b>졸업작품<\/b>, <b>과제작<\/b>, <b>과제물<\/b>, <b>커미션<\/b>, <b>직접 만들기<\/b>가 있어요.<\/li><li>이름, 시작일, 마감일을 넣고 <b>만들기<\/b>를 눌러요.<\/li><li>종류에 맞는 단계(예: 기획 → 콘티 → 선화 → 채색 → 식자·후보정)가 자동으로 들어가고, 단계별 마감 날짜가 잡혀요.<\/li><\/ol>\n<h2>2. 단계 다듬기<\/h2>\n<ul><li><b>비중<\/b>은 그 단계에 시간을 얼마나 쓸지예요. 숫자가 클수록 기간이 길어지고, 바꾸면 날짜가 바로 다시 계산돼요.<\/li><li>단계 이름을 고치거나, <b>+ 단계 추가<\/b>로 늘리거나, ↑ ↓로 순서를 바꿀 수 있어요.<\/li><li>주말에 작업하지 않으면 <b>주말은 쉬어요<\/b>를 켜요. 주말을 빼고 다시 계산해요.<\/li><\/ul>\n<div class=\"note\">마지막의 <b>여유 기간<\/b>은 지우지 않는 걸 추천해요. 수정 요청이나 컨디션 난조처럼 예상 못 한 일이 생겼을 때 버팀목이 돼요.<\/div>\n<h2>3. 진행 상황 적기<\/h2>\n<p>단계마다 진행률을 움직이거나 <b>완료<\/b>에 체크해요. 위쪽에 <b>지금 할 단계<\/b>와 함께 ‘계획대로 가고 있어요’, ‘계획보다 약 4일 늦어요’ 같은 상태가 떠요. 진행 막대의 빨간 선은 오늘까지 끝냈어야 하는 양이에요.<\/p>\n<h2>커미션으로 쓸 때<\/h2>\n<ul><li><b>커미션<\/b>을 고르면 문의·자료 확인 → 러프 → 러프 컨펌 → 선화 → 채색 → 수정 → 납품 단계가 들어가요.<\/li><li><b>의뢰인<\/b>, <b>연락 메모<\/b>, <b>의뢰 내용<\/b> 칸에 누구의 어떤 의뢰인지 적어 둘 수 있어요. 일정 탭에도 의뢰인 이름이 같이 보여요.<\/li><li>‘컨펌’처럼 상대 확인이 필요한 단계에 오면 <b>상대 확인 기다리는 단계<\/b> 표시가 떠요.<\/li><\/ul>\n<div class=\"note\">금액, 입금, 계약 관리는 들어 있지 않아요. 필요한 내용은 메모 칸에 직접 적어 두세요.<\/div>\n<h2>달력으로 한눈에 보기<\/h2>\n<p>처음 열면 <b>달력<\/b> 화면이에요. 맨 위 <b>오늘 할 일<\/b>에 일정마다 지금 할 단계와 남은 날이 정리돼 있고, 아래 달력에는 일정별 색깔로 단계 마감과 최종 마감이 표시돼요. 날짜 아래 얇은 선은 그 일정이 진행 중인 기간이에요.<\/p>\n<ul><li>날짜를 누르면 그날 마감과 진행 중인 단계가 아래에 정리돼요. 항목을 누르면 그 일정으로 들어가요.<\/li><li>달력 위 색깔 이름을 누르면 그 일정을 달력에서 잠깐 숨길 수 있어요.<\/li><li>단계를 고치거나 진행률을 적을 때는 <b>일정별<\/b>로 바꿔요.<\/li><\/ul>\n<h2>색상 바꾸기<\/h2>\n<p>오른쪽 위 <b>색상<\/b>에서 기본, 노을빛, 바다, 빈티지, 팝, 파스텔 중에 고를 수 있어요. 버튼 색과 일정별 색이 함께 바뀌어요.<\/p>\n<h2>앱으로 설치하고 위젯처럼 쓰기<\/h2>\n<ol><li>도구 카드의 <b>앱으로 열기<\/b>를 눌러 일정표를 열어요.<\/li><li>PC 크롬·엣지는 주소창 오른쪽의 설치 아이콘, 안드로이드 크롬은 메뉴(⋮)의 <b>앱 설치<\/b> 또는 <b>홈 화면에 추가<\/b>를 눌러요. 화면 위에 <b>앱으로 설치<\/b> 버튼이 뜨면 그걸 눌러도 돼요.<\/li><li>설치하면 바탕화면이나 홈 화면 아이콘으로 바로 열려요. 인터넷이 없어도 열려요.<\/li><li>위쪽 <b>위젯<\/b>을 누르면 가장 급한 일정의 D-day가 크게 보이는 작은 화면이 돼요. PC에서는 창을 작게 줄여 옆에 띄워 두면 위젯처럼 쓸 수 있어요. 앱 아이콘을 길게 누르면 나오는 <b>위젯 모드<\/b>로 바로 열 수도 있어요.<\/li><\/ol>\n<div class=\"note\">설치한 앱과 받은 파일은 저장 공간이 따로예요. 옮기고 싶으면 한쪽에서 <b>백업 받기<\/b>, 다른 쪽에서 <b>불러오기<\/b>를 해 주세요. 휴대폰 홈 화면에 붙는 진짜 위젯은 웹으로는 만들 수 없어서, 작은 창으로 띄우는 방식이에요. PC는 아래 위젯 프로그램을 쓰면 돼요.<\/div>\n<h2>PC 위젯 프로그램 (선택)<\/h2>\n<p>일정표는 설치 없이 브라우저에서 다 쓸 수 있어요. 바탕화면에 D-day를 늘 띄워 두고 싶을 때만 받으면 돼요.<\/p>\n<ol><li>오른쪽 위 <b>↓ 프로그램 받기<\/b>에서 내 컴퓨터에 맞는 파일을 받아요. 윈도우, 맥(M1~M4 칩), 맥(인텔) 세 가지예요.<\/li><li>압축을 풀고 실행해요. 개인이 만든 프로그램이라 처음 한 번 보안 경고가 떠요.<br>윈도우: 파란 창에서 <b>추가 정보 → 실행<\/b><br>맥: 앱을 <b>응용 프로그램<\/b> 폴더로 옮긴 뒤 실행하고, <b>시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기<\/b><\/li><li>전체 창과 함께 D-day 위젯이 떠요. 핀 버튼을 켜면 다른 창보다 늘 위에 있어요.<\/li><li>컴퓨터를 켜면 위젯이 알아서 떠요. 트레이(맥은 위쪽 메뉴 막대) 아이콘 메뉴에서 끌 수 있어요.<\/li><\/ol>\n<div class=\"note\">프로그램의 일정은 웹사이트와 따로 저장돼요. 옮길 땐 <b>백업 받기<\/b> → <b>불러오기<\/b>를 써 주세요. 자세한 설명은 압축 파일 안 README.txt에 있어요.<\/div>\n<h2>알아 두면 편한 기능<\/h2>\n<ul><li>고친 내용은 바로 자동 저장되고, 제목 아래에 마지막 저장 시각이 보여요.<\/li><li>일정이나 단계를 지웠으면 아래에 뜨는 <b>되돌리기<\/b>로 바로 살릴 수 있어요.<\/li><li>마지막 백업이 일주일 넘으면 위쪽에 백업 알림이 떠요.<\/li><li>달력에서 날짜를 누르고 <b>+ 이날 마감으로 새 일정<\/b>을 누르면 그 날짜가 마감일로 들어간 채로 시작해요.<\/li><li>다 끝낸 일정은 일정 탭 끝에 접혀서, 진행 중인 것만 보여요.<\/li><li>PC에서는 단축키를 쓸 수 있어요. <code>N<\/code> 새 일정, <code>←<\/code> <code>→<\/code> 달 넘기기, <code>T<\/code> 오늘, <code>1<\/code> <code>2<\/code> <code>3<\/code> 보기 바꾸기.<\/li><\/ul>\n<h2>4. 캘린더에 넣기<\/h2>\n<p><b>캘린더 파일(.ics) 받기<\/b>를 누르면 단계별 마감과 최종 마감이 담긴 파일이 받아져요. 구글 캘린더나 폰 캘린더의 <b>가져오기<\/b>로 넣으면 알림을 받을 수 있어요.<\/p>\n<div class=\"note\">일정은 지금 쓰는 브라우저에만 저장돼요. 가끔 <b>백업 받기<\/b>로 파일을 받아 두고, 다른 기기에서는 <b>불러오기<\/b>로 이어서 쓰세요.<\/div>"
  },

   "title": "올리기 전에 폰 화면으로 원고 템포 확인하기",

// ---------- 안전한 본문 ----------
const OK={P:1,H2:1,H3:1,B:1,STRONG:1,I:1,EM:1,OL:1,UL:1,LI:1,CODE:1,BR:1,IMG:1,A:1,DIV:1};
function clean(html){
  const doc=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html');const root=doc.body.firstChild;
  (function walk(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1){c.remove();return}
    walk(c);
    const t=c.tagName;
    if(!OK[t]){if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|svg|SVG|TEMPLATE)$/.test(t)){c.remove();return}
      const blk=/^(H1|H4|H5|H6|SECTION|ARTICLE|BLOCKQUOTE)$/.test(t);
      if(blk){const p=doc.createElement(t==='H1'?'h2':t==='H4'?'h3':'p');while(c.firstChild)p.appendChild(c.firstChild);c.replaceWith(p)}
      else{while(c.firstChild)c.parentNode.insertBefore(c.firstChild,c);c.remove()}return}
    const keep={};
    if(t==='A'){const h=c.getAttribute('href')||'';if(/^(https?:\/\/|#[a-z0-9-]+$)/i.test(h))keep.href=h}
    if(t==='IMG'){const s=c.getAttribute('src')||'';if(/^data:image\/(png|jpe?g|webp|gif);/i.test(s)||/^img\/[\w.-]+$/.test(s))keep.src=s;else{c.remove();return}keep.alt=c.getAttribute('alt')||''}
    if(t==='DIV'){if(c.classList.contains('note'))keep.class='note';else{const p=doc.createElement('p');while(c.firstChild)p.appendChild(c.firstChild);c.replaceWith(p);return}}
    [...c.attributes].forEach(a=>c.removeAttribute(a.name));
    for(const k in keep)c.setAttribute(k,keep[k]);
  })})(root);
  return root.innerHTML.replace(/<p>(\s|<br>)*<\/p>/g,'').trim();
}
function setDoc(box,html){box.innerHTML=clean(html);box.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});box.querySelectorAll('img').forEach(i=>i.loading='lazy')}

    b.appendChild(bt);
    const pen=el('button','pen','✎ 수정');pen.onclick=()=>openEd('tool',i);b.appendChild(pen);
    a.append(shot,b);tl.appendChild(a)});
  // 글 목록

  const add=el('button','post add','+ 새 글 쓰기');add.onclick=()=>openEd('post',-1);pl.appendChild(add);

  $('#editTog').classList.toggle('on',editing);$('#editTog').textContent=editing?'편집 중':'편집';
  route(true);

function route(keep){
  const m=location.hash.match(/^#post-([a-z0-9-]+)$/);const i=m?D.posts.findIndex(x=>x.id===m[1]):-1;const p=i>=0?D.posts[i]:null;
  $('#home').classList.toggle('off',!!p);$('#article').classList.toggle('on',!!p);
  const name=(D.site&&D.site.name)||'';
  if(p){$('#aTag').textContent=p.tag||'';$('#aTitle').textContent=p.title||'';$('#aMeta').textContent=p.date||'';setDoc($('#aDoc'),p.html);document.title=(p.title||'')+' · '+name;
    $('#aEdit').onclick=()=>openEd('post',i);
    const pg=$('#aPager');pg.textContent='';const pv=D.posts[i-1],nx=D.posts[i+1];
    if(pv){const a=el('a');a.href='#post-'+pv.id;a.append(el('small','','← 이전 글'),document.createTextNode(pv.title));pg.appendChild(a)}else pg.appendChild(el('span'));
    if(nx){const a=el('a','nx');a.href='#post-'+nx.id;a.append(el('small','','다음 글 →'),document.createTextNode(nx.title));pg.appendChild(a)}
    if(!keep)scrollTo(0,0)}
  else{document.title=name;if(!keep){const id=location.hash.slice(1);const t=id&&document.getElementById(id);if(t)setTimeout(()=>t.scrollIntoView(),0)}}
  reveal();
}

// ---------- 파일 받기 (Claude 안에서는 downloads로) ----------
async function saveFile(e,path,name){
  if(!downloadsApi)return; // 일반 사이트에서는 링크 그대로 받기
  e.preventDefault();
  try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw 0;await downloadsApi.save({filename:name||path.split('/').pop(),data:await r.blob()});toast('파일을 받았어요','good')}
  catch(err){if(err&&err.code==='declined')return;toast('파일을 받지 못했어요. 잠시 뒤 다시 해 주세요.','bad')}
}

async function persist(){
  if(!artifactApi){toast('이 화면에서는 저장할 수 없어요.','bad');return false}
  const json=JSON.stringify(D);
  if(json.length>12e6){toast('내용이 너무 커요. 글에 넣은 이미지를 줄여 주세요.','bad');return false}
  try{await artifactApi.publish({'data.json':{content:json,contentType:'application/json'}});return true}
  catch(e){const c=e&&e.code;
    if(c==='conflict'){conflicted=true;toast('다른 곳에서 먼저 저장했어요. 새 내용을 불러왔으니 다시 고쳐 주세요.','bad');await load();renderAll()}
    else if(c==='not_writer'||c==='not_granted'){canEdit=false;editing=false;renderAll();toast('편집 권한이 없어요.','bad')}
    else toast('저장하지 못했어요. 잠시 뒤 다시 해 주세요.','bad');
    return false}
}

  if(STATIC){try{D=JSON.parse(document.getElementById('hub-data').textContent)}catch(e){}return}

}

function toolbar(rte){
  const bar=el('div','tbar');let saved=null;
  const keep=()=>{const s=getSelection();if(s.rangeCount&&rte.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange()};
  const back=()=>{rte.focus();if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved)}};
  rte.addEventListener('keyup',keep);rte.addEventListener('mouseup',keep);rte.addEventListener('input',keep);
  const cmd=(c,v)=>{back();document.execCommand(c,false,v);keep()};
  const blockOf=()=>{const s=getSelection();let n=s.anchorNode;if(!n||!rte.contains(n))return null;while(n&&n.parentNode!==rte)n=n.parentNode;return n};
  const B=(label,title,fn)=>{const x=el('button','',label);x.type='button';x.title=title;x.setAttribute('aria-label',title);x.addEventListener('mousedown',e=>e.preventDefault());x.onclick=fn;bar.appendChild(x);return x};
  const sep=()=>bar.appendChild(el('span','sep'));
  B('B','굵게',()=>cmd('bold')).style.fontWeight='900';
  B('I','기울임',()=>cmd('italic')).style.fontStyle='italic';
  sep();
  B('소제목','소제목',()=>cmd('formatBlock','<h2>'));
  B('본문','본문 문단',()=>cmd('formatBlock','<p>'));
  B('1. 목록','번호 목록',()=>cmd('insertOrderedList'));
  B('• 목록','점 목록',()=>cmd('insertUnorderedList'));
  B('안내 상자','안내 상자 넣기/빼기',()=>{back();let n=blockOf();
    if(!n){document.execCommand('insertHTML',false,'<div class="note">안내 문구</div>');return}
    if(n.nodeType===1&&n.classList.contains('note')){const p=document.createElement('p');p.innerHTML=n.innerHTML;n.replaceWith(p);return}
    const d=document.createElement('div');d.className='note';if(n.nodeType===3){n.replaceWith(d);d.appendChild(n)}else if(/^(P|H2|H3)$/.test(n.tagName)){d.innerHTML=n.innerHTML;n.replaceWith(d)}else{n.replaceWith(d);d.appendChild(n)}});
  B('주소','주소·메뉴 이름 표시',()=>{back();const s=getSelection();const t=s.toString();if(!t){toast('표시할 글자를 먼저 골라 주세요.','bad');return}
    document.execCommand('insertHTML',false,'<code>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code>&#8203;')});
  sep();
  let lr=null;
  B('링크','링크 걸기',()=>{if(lr){lr.remove();lr=null;return}const s=getSelection();if(!saved||saved.collapsed){toast('링크를 걸 글자를 먼저 골라 주세요.','bad');return}
    lr=el('div','linkrow');const inp=el('input');inp.placeholder='https://';inp.setAttribute('aria-label','링크 주소');const ok=el('button','mini','걸기');const no=el('button','mini','취소');
    const done=()=>{lr.remove();lr=null};ok.onclick=()=>{const u=inp.value.trim();if(!/^https?:\/\//i.test(u)){toast('https://로 시작하는 주소를 적어 주세요.','bad');return}cmd('createLink',u);done()};no.onclick=done;
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok.click()}};lr.append(inp,ok,no);bar.after(lr);inp.focus()});
  const fi=el('input');fi.type='file';fi.accept='image/*';fi.hidden=true;bar.appendChild(fi);
  B('이미지','이미지 넣기',()=>fi.click());
  fi.onchange=async()=>{const file=fi.files[0];fi.value='';if(!file)return;try{const url=await shrink(file);back();document.execCommand('insertHTML',false,'<img src="'+url+'" alt=""><p><br></p>');keep()}catch(e){toast('이미지를 넣지 못했어요.','bad')}};
  sep();
  B('서식 지우기','서식 지우기',()=>{cmd('removeFormat');cmd('formatBlock','<p>')});
  rte.addEventListener('paste',e=>{const t=e.clipboardData&&e.clipboardData.getData('text/plain');if(t==null)return;e.preventDefault();
    const html=t.split(/\n{2,}/).map(par=>'<p>'+par.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</p>').join('');document.execCommand('insertHTML',false,html)});
  return bar;
}
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const M=1400;let w=im.naturalWidth,h=im.naturalHeight;if(w>M){h=Math.round(h*M/w);w=M}
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.84))};im.onerror=no;im.src=u})}

    const r=await fetch('index.html',{cache:'no-store'});if(!r.ok)throw 0;const src=await r.text();
    const cut=src.indexOf('<!--/head-->');if(cut<0)throw 0;
    const S=D.site||{};const base=(S.siteUrl||'').trim().replace(/\/+$/,'');const ogImg=(/^https?:\/\//.test(base)?base+'/':'')+'img/og.jpg';
    const desc=(S.lead||'').slice(0,150);
    const head='<meta property="og:type" content="website"><meta property="og:title" content="'+esc(S.name)+'"><meta name="description" content="'+esc(desc)+'"><meta property="og:description" content="'+esc(desc)+'"><meta property="og:image" content="'+esc(ogImg)+'"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">'+(base?'<meta property="og:url" content="'+esc(base+'/')+'">':'');
    const top=src.slice(0,cut).replace(/<title>[^<]*<\/title>/,'<title>'+esc(S.name)+'</title>').replace(/<meta name="claude:viewport-fit-sides"[^>]*>/,'');
    const SC='<scr'+'ipt',EC='</scr'+'ipt>';
    const html='<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+head+'<style>[hidden]{display:none!important}</style>'+top+'</head><body>'+SC+'>window.__HUB_STATIC__=true'+EC+SC+' id="hub-data" type="application/json">'+JSON.stringify(D).replace(/</g,'\\u003c')+EC+src.slice(cut+12)+'</body></html>';
    const zip=new JSZip();zip.file('index.html',html);
    for(let k=0;k<FILES.length;k++){btn.textContent='담는 중 '+(k+1)+'/'+FILES.length;const q=await fetch(FILES[k],{cache:'no-store'});if(!q.ok)throw 0;zip.file(FILES[k],await q.blob())}
    zip.file('읽어 주세요.txt','압축을 풀고, 안의 파일과 폴더를 GitHub 저장소의 Add file → Upload files에 끌어다 놓으면 사이트가 바뀌어요.\n처음 올리는 방법은 사이트의 사용법 글 ‘내 포트폴리오를 무료 사이트로 올리기 (GitHub Pages)’를 참고해 주세요.\n');
    btn.textContent='압축 중…';
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    await downloadsApi.save({filename:(S.name||'site').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_')+'_사이트.zip',data:blob});toast('사이트 파일을 만들었어요','good');
  }catch(e){if(!(e&&e.code==='declined'))toast(e&&e.code==='too_large'?'파일이 너무 커서 받을 수 없어요.':'사이트 파일을 만들지 못했어요.','bad')}
  finally{zipBusy=false;btn.disabled=false;btn.textContent='사이트 파일(zip)'}
};

// ---------- 시작 ----------
renderAll();
load().then(renderAll);
(function caps(n){
  if(STATIC)return;
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(d=>{downloadsApi=d}).catch(()=>{});
    window.claude.use('artifact').then(a=>{artifactApi=a;canEdit=!!a;renderAll()}).catch(()=>{});
  }else if(n<40)setTimeout(()=>caps(n+1),250);
})(0);
})();
</script>
